<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Probar video 360 — IRRUMPE</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { min-height: 100vh; }
    .tool { width: min(760px, 100%); margin: 0 auto; padding: 28px var(--gutter) 48px; }
    .tool h1 { margin: 0 0 6px; font: 800 22px var(--font-display); font-stretch: 125%; letter-spacing: 0.2em; text-transform: uppercase; }
    .tool p { margin: 0 0 16px; color: var(--ink-2); font-size: 12px; line-height: 1.7; }
    .tool form { display: flex; gap: 8px; margin-bottom: 16px; }
    .tool input {
      flex: 1; min-width: 0; padding: 12px; border: 1px solid var(--line); background: #0d0d0d; color: var(--ink);
      font: 13px var(--font-mono);
    }
    .tool button, .tool .btn {
      padding: 12px 16px; border: 1px solid var(--red); background: rgba(241, 27, 26, 0.12); color: var(--ink);
      font: 11px var(--font-mono); letter-spacing: 0.2em; text-transform: uppercase; text-decoration: none; cursor: pointer;
    }
    .player { position: relative; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); margin-bottom: 16px; }
    .player > * { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .checks { list-style: none; margin: 0 0 16px; padding: 0; border-top: 1px solid var(--line); }
    .checks li { display: grid; grid-template-columns: 1.6em 11em 1fr; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 12px; line-height: 1.5; }
    .checks b { font-weight: 400; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.14em; font-size: 10px; padding-top: 2px; }
    .checks [data-s='ok'] .mark { color: #5bd17a; }
    .checks [data-s='bad'] .mark { color: var(--red); }
    .checks [data-s='wait'] .mark { color: var(--ink-3); }
    .verdict { margin: 0 0 16px; padding: 12px; border: 1px solid var(--line); font-size: 13px; }
    .verdict[data-s='ok'] { border-color: #5bd17a; }
    .verdict[data-s='bad'] { border-color: var(--red); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .snippet { display: block; padding: 10px; background: #0d0d0d; border: 1px solid var(--line); font-size: 11px; overflow-x: auto; white-space: pre; user-select: all; }
  </style>
</head>
<body>
  <main class="tool">
    <h1>Probar video 360</h1>
    <p>Carga un video de YouTube igual que la galería y dice si se puede ver fuera de YouTube y si es 360.
       Pruébalo <strong>en el celular</strong>: un mismo video puede estar bloqueado según el país o el aparato.</p>
    <form id="form">
      <input id="url" type="url" inputmode="url" spellcheck="false" placeholder="https://youtu.be/…" required>
      <button type="submit">Probar</button>
    </form>
    <div class="player" id="player-box" hidden><div id="player"></div></div>
    <p class="verdict" id="verdict" hidden></p>
    <ul class="checks" id="checks" hidden>
      <li id="c-embed"><span class="mark"></span><b>Fuera de YouTube</b><span class="text"></span></li>
      <li id="c-play"><span class="mark"></span><b>Reproduce</b><span class="text"></span></li>
      <li id="c-360"><span class="mark"></span><b>Es 360</b><span class="text"></span></li>
    </ul>
    <div class="actions" id="actions" hidden>
      <a class="btn" id="try" href="ar/">Probar con el tótem</a>
      <button id="copy" type="button">Copiar para config.js</button>
    </div>
    <code class="snippet" id="snippet" hidden></code>
  </main>

  <script>
    (function () {
      'use strict';
      const $ = (s) => document.querySelector(s);
      const MARK = { ok: '✓', bad: '✗', wait: '…' };
      let player = null;
      let timer = 0;
      let state = {};

      // Igual que ar/video360.js.
      function youtubeId(url) {
        if (!url) return null;
        if (/^[\w-]{11}$/.test(url)) return url;
        const m = String(url).match(/(?:youtu\.be\/|[?&]v=|\/(?:live|shorts|embed)\/)([\w-]{11})/);
        return m ? m[1] : null;
      }
      function errorText(code) {
        if (code === 101 || code === 150 || code === 152 || code === 153) return 'No: el dueño del video, o un titular de derechos (por ejemplo de la música), no permite verlo fuera de YouTube.';
        if (code === 100) return 'No: el video no existe, es privado o fue eliminado.';
        if (code === 2) return 'No: el link no es válido.';
        return 'No: error del reproductor (' + code + ').';
      }

      function check(id, s, text) {
        const li = $(id);
        li.dataset.s = s;
        li.querySelector('.mark').textContent = MARK[s];
        li.querySelector('.text').textContent = text;
      }
      function verdict(s, text) {
        const v = $('#verdict');
        v.hidden = false;
        v.dataset.s = s;
        v.textContent = text;
      }

      let api = null;
      function loadAPI() {
        if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
        if (api) return api;
        api = new Promise((resolve, reject) => {
          window.onYouTubeIframeAPIReady = () => resolve(window.YT);
          const s = document.createElement('script');
          s.src = 'https://www.youtube.com/iframe_api';
          s.onerror = () => { api = null; reject(new Error('api')); };
          document.head.appendChild(s);
        });
        return api;
      }

      function finish() {
        clearTimeout(timer);
        const ok = state.embed && state.play;
        if (!state.embed) verdict('bad', 'No sirve para la galería: elige otro video, o súbelo como archivo .mp4 propio (ver ar/README.md).');
        else if (state.is360 === false) verdict('bad', 'Se puede ver, pero no es 360: en la galería se vería plano detrás del tótem.');
        else if (ok) verdict('ok', 'Sirve para la galería.');
        $('#actions').hidden = !state.embed;
      }

      function test(url) {
        const id = youtubeId(url.trim());
        state = { id, embed: null, play: null, is360: null };
        $('#checks').hidden = false;
        $('#verdict').hidden = true;
        $('#actions').hidden = true;
        $('#snippet').hidden = true;
        check('#c-embed', 'wait', 'Comprobando…');
        check('#c-play', 'wait', '');
        check('#c-360', 'wait', '');
        if (!id) {
          check('#c-embed', 'bad', 'No es un link de YouTube.');
          verdict('bad', 'Pega el link tal como sale en "Compartir" de YouTube.');
          return;
        }
        $('#try').href = 'ar/?video=' + encodeURIComponent('https://youtu.be/' + id);
        $('#player-box').hidden = false;
        loadAPI().then((YT) => {
          if (player) { try { player.destroy(); } catch (e) { /* ya no existe */ } }
          $('#player-box').innerHTML = '<div id="player"></div>';
          player = new YT.Player('player', {
            videoId: id,
            width: '100%',
            height: '100%',
            playerVars: { autoplay: 1, mute: 1, playsinline: 1, rel: 0, origin: location.origin },
            events: {
              onReady() {
                player.mute();
                player.playVideo();
              },
              onStateChange(e) {
                if (e.data !== YT.PlayerState.PLAYING || state.play) return;
                state.embed = true;
                state.play = true;
                check('#c-embed', 'ok', 'Sí, se puede incrustar.');
                check('#c-play', 'ok', 'Sí.');
                const data = (player.getVideoData && player.getVideoData()) || {};
                const title = (data.title || 'Prueba 360').replace(/'/g, '’');
                $('#snippet').textContent = "{ titulo: '" + title + "', video: 'https://youtu.be/" + id + "' },";
                $('#snippet').hidden = false;
                // Los videos 360 informan su vista; los planos devuelven un objeto vacío.
                setTimeout(() => {
                  const sp = (player.getSphericalProperties && player.getSphericalProperties()) || {};
                  state.is360 = Object.keys(sp).length > 0;
                  check('#c-360', state.is360 ? 'ok' : 'bad', state.is360 ? 'Sí.' : 'No, es un video plano.');
                  finish();
                }, 1200);
              },
              onError(e) {
                state.embed = false;
                check('#c-embed', 'bad', errorText(e.data));
                check('#c-play', 'bad', '—');
                check('#c-360', 'wait', '—');
                finish();
              },
            },
          });
          clearTimeout(timer);
          timer = setTimeout(() => {
            if (state.play || state.embed === false) return;
            check('#c-play', 'wait', 'No empezó solo. Toca ▶ en el video; si es una transmisión programada, prueba cuando esté en vivo.');
          }, 12000);
        }).catch(() => {
          check('#c-embed', 'bad', 'No se pudo cargar YouTube (¿sin internet?).');
        });
      }

      $('#form').addEventListener('submit', (e) => {
        e.preventDefault();
        history.replaceState(null, '', '?v=' + encodeURIComponent($('#url').value.trim()));
        test($('#url').value);
      });
      $('#copy').addEventListener('click', () => {
        const text = $('#snippet').textContent;
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => { $('#copy').textContent = 'Copiado'; }).catch(() => {});
      });
      const v = new URLSearchParams(location.search).get('v');
      if (v) { $('#url').value = v; test(v); }
    })();
  </script>
</body>
</html>
