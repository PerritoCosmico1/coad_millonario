<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>POLEA · Primer vuelo — AR</title>
  <meta name="description" content="POLEA · Primer vuelo. 15 de noviembre en Monarca, Concepción. El escenario como un festival, en realidad aumentada.">
  <meta name="theme-color" content="#d9d8d4">
  <meta property="og:title" content="POLEA · Primer vuelo">
  <meta property="og:description" content="15 NOV · Monarca · Aníbal Pinto 143, Concepción">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="modulepreload" href="../vendor/three.min.js">
  <link rel="modulepreload" href="../ar/sessions.js">
  <link rel="modulepreload" href="../ar/audio.js">
  <link rel="modulepreload" href="../ar/ritmo.js">
  <link rel="modulepreload" href="../ar/escenario.js">
  <link rel="modulepreload" href="../ar/cielo.js">
  <link rel="stylesheet" href="polea.css">
</head>
<body class="polea">
  <!-- Lanzador: como el afiche -->
  <main class="launch" id="launch">
    <header class="launch__head">
      <p class="launch__copro">coproducción: Vieja Sorda</p>
      <h1 class="launch__title"><img src="img/polea.webp" alt="POLEA" width="978" height="124"></h1>
      <p class="launch__sub"><img src="img/primer-vuelo.webp" alt="Primer vuelo" width="376" height="31"></p>
    </header>
    <section class="launch__lineup" id="lineup-launch" aria-label="Line-up"></section>
    <footer class="launch__foot">
      <p class="launch__where">15 nov · Monarca · Aníbal Pinto 143</p>
      <div class="launch__row" id="actions">
        <button class="launch__enter" id="enter" type="button" disabled>Abrir AR</button>
        <button class="launch__mic" id="mic" type="button" aria-pressed="false" aria-label="Que las luces sigan la música (micrófono)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>
        </button>
      </div>
      <div class="launch__desktop" id="desktop" hidden>
        <div class="launch__qr" id="qr" aria-hidden="true"></div>
        <p>Ábrelo en tu celular</p>
      </div>
    </footer>
    <section class="sheet sheet--launch" id="launch-sheet" hidden aria-live="polite"></section>
  </main>

  <!-- Experiencia: la cámara y el escenario aumentado -->
  <div class="xr" id="xr" hidden>
    <video class="xr__video" id="xr-video" playsinline muted hidden></video>
    <div class="xr__ui" id="xr-ui">
      <header class="xr__top">
        <button class="xr__icon" id="xr-exit" type="button" aria-label="Salir">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <div class="xr__top-right">
          <button class="xr__icon" id="xr-mic" type="button" aria-pressed="false" aria-label="Que las luces sigan la música (micrófono)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>
          </button>
          <button class="xr__icon" id="xr-rec" type="button" aria-label="Modo grabación: esconder los botones">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5" class="fill"/></svg>
          </button>
          <button class="xr__icon" id="refix" type="button" aria-label="Volver a encuadrar el escenario">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
          </button>
        </div>
      </header>

      <p class="toast" id="toast" role="status" hidden></p>
      <div class="aim" id="aim" aria-hidden="true" hidden></div>

      <div class="xr__dock">
        <p class="hint" id="hint" hidden></p>
        <button class="pill" id="fix" type="button" hidden>Fijar aquí</button>
        <div class="follow" id="follow" hidden>
          <a class="ig" id="ig" href="#" target="_blank" rel="noopener">
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><defs><radialGradient id="ig-dock" cx="0.3" cy="1.07" r="1.2"><stop offset="0" stop-color="#fdd574"/><stop offset="0.25" stop-color="#fb7d2b"/><stop offset="0.55" stop-color="#d62976"/><stop offset="0.85" stop-color="#962fbf"/><stop offset="1" stop-color="#4f5bd5"/></radialGradient></defs><rect width="24" height="24" rx="6.5" fill="url(#ig-dock)"/><rect x="5" y="5" width="14" height="14" rx="4.2" fill="none" stroke="#fff" stroke-width="1.7"/><circle cx="12" cy="12" r="3.3" fill="none" stroke="#fff" stroke-width="1.7"/><circle cx="16.3" cy="7.7" r="1.05" fill="#fff"/></svg></span>
            <span class="ig__handle" id="ig-handle"></span>
            <span class="ig__go" aria-hidden="true">↗</span>
          </a>
          <div class="follow__more" id="follow-more"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="../vendor/qrcode.js"></script>
  <script type="module" src="polea.js"></script>
</body>
</html>
