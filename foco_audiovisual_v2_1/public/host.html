<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#040714"><link rel="manifest" href="/manifest.webmanifest"><title>FOCO V2.1 · Control</title><link rel="stylesheet" href="/styles.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="/">FOCO <span>CONTROL V2.1</span></a><div class="top-actions"><button class="btn ghost" onclick="copyLink('/broadcast.html')">Copiar TV</button><button class="btn ghost" onclick="copyLink('/player.html?player=A')">Link A</button><button class="btn ghost" onclick="copyLink('/player.html?player=B')">Link B</button><button class="btn warn" onclick="act('commercial')">Comercial</button></div></header><main class="container host-wrap"><div id="host"></div></main></div><div id="pinModal" class="modal"><div class="modal-card"><div class="kicker">Acceso de producción</div><h2>Panel del anfitrión</h2><p class="muted">PIN inicial: 2468, salvo que lo cambies al desplegar.</p><div class="field"><label>PIN</label><input id="pinInput" type="password" inputmode="numeric" placeholder="2468"></div><button class="btn primary block" style="margin-top:12px" onclick="login()">Entrar</button><p id="pinError" class="small" style="color:var(--red)"></p></div></div><script src="/common.js"></script><script>
let latest=null,stream=null,tab='game',editing=-1;

function openPin(){document.getElementById('pinModal').classList.add('open')}
async function login(){sessionStorage.setItem('focoHostPin',document.getElementById('pinInput').value.trim());try{await API.state('host');document.getElementById('pinModal').classList.remove('open');connect()}catch(e){sessionStorage.removeItem('focoHostPin');document.getElementById('pinError').textContent=e.message}}
function connect(){stream?.close();stream=API.stream('host','',s=>{latest=s;render()},()=>{})}
async function act(action,extra={}){try{await API.post('/api/action',{action,...extra},true)}catch(e){toast(e.message)}}
function setTab(t){tab=t;render()}
function copyLink(path){const u=new URL(path,location.origin),c=accessCode();if(c)u.searchParams.set('code',c);navigator.clipboard?.writeText(u).then(()=>toast('Link copiado')).catch(()=>prompt('Copia este link',u))}

function questionRows(s){return s.questions.map((q,i)=>{const tag=q.discarded?'DESCARTADA':q.used?'USADA':'';return `<button class="q-row ${i===s.currentQuestionIndex?'active':''} ${q.used?'used':''}" onclick="act('showQuestion',{index:${i}})"><span class="q-num">${i+1}</span><span class="title"><b>${esc(q.text)}</b><span>${difficultyLabels[q.difficulty]} · ${esc(q.category)} · ${money(q.prize)}${tag?` · ${tag}`:''}</span></span><span class="badge ${q.difficulty}">${difficultyLabels[q.difficulty]}</span></button>`}).join('')}

function playerMini(s,p){const n=p==='A'?s.config.playerAName:s.config.playerBName,a=s.answers[p],lf=s.lifelines[p],active=s.config.mode==='duel'||s.config.activePlayer===p,time=s.responseTimes?.[p];return `<div class="player-mini player-${p.toLowerCase()} ${active?'active':''}"><div class="small muted">${esc(n)}</div><div class="cash">${money(s.winnings[p])}</div><div class="choice">${a===null?'Sin respuesta':`Eligió ${letters[a]}`}${s.revealedPlayerAnswers[p]?' · revelada':''}</div>${a!==null?`<div class="response-time">Tiempo: ${formatMs(time)}</div>`:''}${s.config.mode==='classic'?`<div class="lifeline-row"><span class="lifeline ${lf.fifty?'available':'used'}">50/50</span><span class="lifeline ${lf.hint?'available':'used'}">Pista</span><span class="lifeline ${lf.swap?'available':'used'}">Cambio</span></div>`:''}</div>`}

function ladder(s){return `<div class="prize-ladder">${[['impossible','Imposible'],['hard','Difícil'],['medium','Medio'],['easy','Fácil']].map(([k,l])=>`<div class="prize-step ${s.question?.difficulty===k?'current':''}"><span class="badge ${k}">${l}</span><span class="level">Premio</span><span class="amount">${money(s.config.prizeMap[k])}</span></div>`).join('')}</div>`}

function optClass(s,i){let c='answer';if(i===s.question.correctIndex)c+=' correct';if(s.revealedPlayerAnswers.A&&s.answers.A===i)c+=' host-picked-a';if(s.revealedPlayerAnswers.B&&s.answers.B===i)c+=' host-picked-b';if(s.config.mode==='classic'&&(s.hiddenOptions[s.config.activePlayer]||[]).includes(i))c+=' dim';return c}

function lifelines(s){if(s.config.mode!=='classic')return `<p class="muted small">Los comodines se usan en modo clásico.</p>`;const p=s.config.activePlayer,lf=s.lifelines[p],name=p==='A'?s.config.playerAName:s.config.playerBName;return `<div class="section-label">Comodines · ${esc(name)}</div><div class="action-grid three"><button class="btn" ${lf.fifty?'':'disabled'} onclick="act('useLifeline',{player:'${p}',type:'fifty'})">50 / 50</button><button class="btn" ${lf.hint?'':'disabled'} onclick="act('useLifeline',{player:'${p}',type:'hint'})">Pista</button><button class="btn" ${lf.swap?'':'disabled'} onclick="act('useLifeline',{player:'${p}',type:'swap'})">Cambiar pregunta</button></div>`}

function timerControls(s){const current=s.config.timerSeconds;const presets=[10,15,20,30,45,60];return `<div class="section-label">Tiempo de respuesta</div><div class="timer-control"><div class="timer-live ${s.phase==='open'?'running':''}"><span class="timer-live-label">RELOJ</span><strong data-live-timer>${timerLabel(s)}</strong></div><div class="timer-presets">${presets.map(n=>`<button class="btn ghost ${current===n?'selected-preset':''}" ${s.phase==='open'?'disabled':''} onclick="act('setTimer',{seconds:${n}})">${n}s</button>`).join('')}<button class="btn ghost ${current===0?'selected-preset':''}" ${s.phase==='open'?'disabled':''} onclick="act('setTimer',{seconds:0})">Sin límite</button></div><div class="controls" style="margin-top:8px"><input id="customTimer" type="number" min="3" max="300" inputmode="numeric" placeholder="Personalizado (seg)" style="max-width:190px"><button class="btn" ${s.phase==='open'?'disabled':''} onclick="setCustomTimer()">Aplicar</button></div></div>`}

function duelResult(s){if(s.config.mode!=='duel'||!s.correctRevealed||!s.duelResult)return'';const r=s.duelResult,n=p=>p==='A'?s.config.playerAName:s.config.playerBName;if(!r.winners.length)return `<div class="duel-result-host none"><b>Sin ganador</b><span>Ninguno acertó.</span></div>`;const names=r.winners.map(n).join(' + ');let detail=r.reason==='fastest'&&r.deltaMs!=null?`Diferencia: ${formatMs(r.deltaMs)}`:r.reason==='tie'?'Empate exacto':r.reason==='all'?'Ambos correctos':'Respuesta correcta';if(!r.awardable)detail+=' · pregunta sin premio';return `<div class="duel-result-host"><b>Gana ${esc(names)}</b><span>${detail}</span></div>`}

function preparationControls(s){if(s.phase==='idle')return `<button class="btn primary" onclick="act('prepareShow')">Preparar · mostrar apertura</button>`;if(s.phase==='intro')return `<button class="btn primary" onclick="act('showQuestion',{index:${s.currentQuestionIndex}})">Mostrar primera pregunta</button>`;return `<button class="btn primary" onclick="act('showQuestion',{index:${s.currentQuestionIndex}})">Preparar / reiniciar pregunta</button>`}

function gameTab(s){const q=s.question;if(!q)return'<div class="panel">No hay preguntas.</div>';const revealBtns=s.config.mode==='duel'?`<button class="btn warn" ${s.revealedPlayerAnswers.A?'disabled':''} onclick="act('revealPlayerAnswer',{player:'A'})">Revelar A</button><button class="btn warn" ${s.revealedPlayerAnswers.B?'disabled':''} onclick="act('revealPlayerAnswer',{player:'B'})">Revelar B</button>`:`<button class="btn warn" ${s.revealedPlayerAnswers[s.config.activePlayer]?'disabled':''} onclick="act('revealPlayerAnswer',{player:'${s.config.activePlayer}'})">Revelar respuesta</button>`;const activeBtns=s.config.mode==='classic'?`<div class="section-label">Concursante activo</div><div class="action-grid"><button class="btn ${s.config.activePlayer==='A'?'primary':''}" onclick="act('setActivePlayer',{player:'A'})">Juega ${esc(s.config.playerAName)}</button><button class="btn ${s.config.activePlayer==='B'?'primary':''}" onclick="act('setActivePlayer',{player:'B'})">Juega ${esc(s.config.playerBName)}</button></div>`:'';const awardWarning=!s.roundAwardable?`<div class="host-warning">Esta pregunta ya fue usada/descartada. Puede mostrarse, pero <b>no volverá a entregar premio</b>.</div>`:'';return `<div class="host-grid"><section><div class="panel"><div class="panel-title"><div><div class="kicker">En control</div><h2 style="margin:4px 0">${s.config.mode==='duel'?'Duelo':'Clásico'} · ${difficultyLabels[q.difficulty]}</h2></div><span class="badge ${q.difficulty}">${money(q.prize)}</span></div>${awardWarning}<div class="question-preview"><div class="q-meta"><span class="badge">${esc(q.category)}</span><span class="badge">Alternativas ${s.revealedOptions}/4</span><span class="badge">${s.config.timerSeconds?`${s.config.timerSeconds}s`:'Sin límite'}</span></div><div class="q-text">${esc(q.text)}</div><div class="answer-grid">${q.options.map((o,i)=>`<div class="${optClass(s,i)}"><strong>${letters[i]}</strong><span>${esc(o)}</span></div>`).join('')}</div>${q.hint&&s.hintVisible[s.config.activePlayer]?`<div class="hint-card" style="width:100%"><b>Pista:</b> ${esc(q.hint)}</div>`:''}</div>${activeBtns}<div class="section-label">0 · Preparación</div><div class="controls">${preparationControls(s)}</div><div class="section-label">1 · Presentar alternativas</div><div class="action-grid"><button class="btn" ${s.phase==='intro'||s.revealedOptions>=4?'disabled':''} onclick="act('revealNextOption')">Revelar siguiente</button><button class="btn" ${s.phase==='intro'||s.revealedOptions>=4?'disabled':''} onclick="act('revealAllOptions')">Mostrar todas</button></div>${timerControls(s)}<div class="section-label">2 · Respuestas</div><div class="action-grid"><button class="btn good" ${s.revealedOptions===4&&s.phase==='question'?'':'disabled'} onclick="act('openAnswers')">Abrir respuestas + iniciar reloj</button><button class="btn danger" ${s.phase==='open'?'':'disabled'} onclick="act('lockAnswers')">Bloquear</button></div><div class="section-label">3 · Suspenso / resultado</div><div class="action-grid three">${revealBtns}<button class="btn good" ${s.correctRevealed||!(s.phase==='locked'||s.phase==='result')?'disabled':''} onclick="act('revealCorrect')">Revelar correcta + premio</button></div>${duelResult(s)}${lifelines(s)}<div class="section-label">Navegación</div><div class="action-grid three"><button class="btn ghost" onclick="act('previousQuestion')">← Anterior</button><button class="btn ghost" onclick="act('resetRound')">Reiniciar ronda</button><button class="btn primary" onclick="act('nextQuestion')">Siguiente →</button></div><details style="margin-top:17px"><summary class="small muted" style="cursor:pointer">Corrección de emergencia</summary><div class="form-grid" style="margin-top:12px"><div class="field"><label>Monto</label><input id="corr" type="number" value="250000" step="50000"></div><div class="field"><label>Acciones</label><div class="controls"><button class="btn good" onclick="correction('A',1)">+ A</button><button class="btn danger" onclick="correction('A',-1)">− A</button><button class="btn good" onclick="correction('B',1)">+ B</button><button class="btn danger" onclick="correction('B',-1)">− B</button></div></div></div><button class="btn danger" style="margin-top:10px" onclick="resetGame()">Reiniciar partida completa</button></details></div></section><aside><div class="panel"><div class="status-grid">${playerMini(s,'A')}${playerMini(s,'B')}</div><div class="section-label">Escalera de premios</div>${ladder(s)}</div><div class="panel" style="margin-top:18px"><div class="panel-title"><h3>Preguntas</h3><span class="badge">${s.currentQuestionIndex+1}/${s.questionCount}</span></div><div class="list">${questionRows(s)}</div></div></aside></div>`}

function setCustomTimer(){const n=Number(document.getElementById('customTimer')?.value);if(!Number.isFinite(n)||n<3)return toast('Usa entre 3 y 300 segundos');act('setTimer',{seconds:n})}
function correction(p,sign){const n=Math.abs(Number(document.getElementById('corr').value||0));if(!n)return toast('Ingresa un monto');act('adjustScore',{player:p,delta:n*sign})}
function resetGame(){if(confirm('¿Reiniciar puntajes, comodines y partida?'))act('resetGame')}

function questionsTab(s){return `<div class="host-grid"><section class="panel"><div class="panel-title"><div><div class="kicker">Banco del programa</div><h2>Editor de preguntas</h2></div><button class="btn primary" onclick="newQ()">Nueva pregunta</button></div><div class="list" style="max-height:none">${s.questions.map((q,i)=>`<div class="q-row ${editing===i?'active':''} ${q.used?'used':''}"><span class="q-num">${i+1}</span><button style="background:none;border:0;color:inherit;text-align:left;min-width:0" class="title" onclick="editQ(${i})"><b>${esc(q.text)}</b><span>${difficultyLabels[q.difficulty]} · ${esc(q.category)}${q.discarded?' · descartada':q.used?' · usada':''}</span></button><button class="btn ghost" onclick="editQ(${i})">Editar</button></div>`).join('')}</div></section><aside>${qForm(s)}</aside></div>`}

function qForm(s){if(editing<0||editing>=s.questions.length)return'<div class="panel"><h3>Editor</h3><p class="muted">Selecciona una pregunta.</p></div>';const q=s.questions[editing];return `<div class="panel"><div class="panel-title"><h3>Pregunta ${editing+1}</h3><span class="badge ${q.difficulty}">${money(s.config.prizeMap[q.difficulty])}</span></div><div class="form-grid"><div class="field full"><label>Pregunta</label><textarea id="qe_text">${esc(q.text)}</textarea></div><div class="field"><label>Categoría</label><input id="qe_cat" value="${esc(q.category)}"></div><div class="field"><label>Dificultad</label><select id="qe_diff"><option value="easy" ${q.difficulty==='easy'?'selected':''}>Fácil · $250.000</option><option value="medium" ${q.difficulty==='medium'?'selected':''}>Medio · $500.000</option><option value="hard" ${q.difficulty==='hard'?'selected':''}>Difícil · $1.000.000</option><option value="impossible" ${q.difficulty==='impossible'?'selected':''}>Imposible · $10.000.000</option></select></div>${q.options.map((o,i)=>`<div class="field full"><label>Alternativa ${letters[i]}</label><input id="qe_o${i}" value="${esc(o)}"></div>`).join('')}<div class="field"><label>Correcta</label><select id="qe_correct">${letters.map((l,i)=>`<option value="${i}" ${q.correctIndex===i?'selected':''}>${l}</option>`).join('')}</select></div><div class="field full"><label>Pista</label><textarea id="qe_hint">${esc(q.hint||'')}</textarea></div></div><div class="controls" style="margin-top:12px"><button class="btn primary" onclick="saveQ()">Guardar</button><button class="btn danger" onclick="deleteQ()">Eliminar</button></div></div>`}

function editQ(i){editing=i;render()}
function newQ(){latest.questions.push({id:`q_${Date.now()}`,category:'General',difficulty:'easy',text:'Nueva pregunta',options:['Opción A','Opción B','Opción C','Opción D'],correctIndex:0,hint:'',prize:250000});editing=latest.questions.length-1;render()}
async function saveQ(){const q={...latest.questions[editing],text:document.getElementById('qe_text').value.trim(),category:document.getElementById('qe_cat').value.trim(),difficulty:document.getElementById('qe_diff').value,options:[0,1,2,3].map(i=>document.getElementById(`qe_o${i}`).value.trim()),correctIndex:Number(document.getElementById('qe_correct').value),hint:document.getElementById('qe_hint').value.trim()},copy=latest.questions.map((x,i)=>i===editing?q:x);try{await API.post('/api/questions',{questions:copy},true);toast('Pregunta guardada')}catch(e){toast(e.message)}}
async function deleteQ(){if(latest.questions.length<=1)return toast('Debe quedar una pregunta');if(!confirm('¿Eliminar?'))return;const copy=latest.questions.filter((_,i)=>i!==editing);editing=Math.min(editing,copy.length-1);try{await API.post('/api/questions',{questions:copy},true)}catch(e){toast(e.message)}}

function settingsTab(s){return `<div class="host-grid"><section class="panel"><div class="kicker">Configuración</div><h2>Formato del programa</h2><div class="form-grid"><div class="field full"><label>Título</label><input id="cfg_title" value="${esc(s.config.showTitle)}"></div><div class="field full"><label>Subtítulo</label><input id="cfg_sub" value="${esc(s.config.showSubtitle)}"></div><div class="field"><label>Concursante A</label><input id="cfg_a" value="${esc(s.config.playerAName)}"></div><div class="field"><label>Concursante B</label><input id="cfg_b" value="${esc(s.config.playerBName)}"></div><div class="field"><label>Modo</label><select id="cfg_mode"><option value="classic" ${s.config.mode==='classic'?'selected':''}>Clásico · concursante vs presentador</option><option value="duel" ${s.config.mode==='duel'?'selected':''}>Duelo · cara a cara</option></select></div><div class="field"><label>Concursante activo (clásico)</label><select id="cfg_active"><option value="A" ${s.config.activePlayer==='A'?'selected':''}>${esc(s.config.playerAName)}</option><option value="B" ${s.config.activePlayer==='B'?'selected':''}>${esc(s.config.playerBName)}</option></select></div><div class="field full"><label>Regla Duelo</label><select id="cfg_duel"><option value="fastest" ${s.config.duelRule==='fastest'?'selected':''}>Si ambos aciertan, gana el más rápido</option><option value="all" ${s.config.duelRule==='all'?'selected':''}>Todos los que aciertan reciben premio</option></select></div><div class="field"><label>Tiempo por pregunta (0 = sin límite)</label><input id="cfg_timer" type="number" min="0" max="300" value="${s.config.timerSeconds}"></div></div><button class="btn primary" style="margin-top:12px" onclick="saveCfg()">Guardar configuración</button></section><aside><div class="panel"><div class="section-label" style="margin-top:0">Premios fijos</div>${ladder(s)}</div><div class="panel" style="margin-top:18px"><h3>Pack del programa</h3><p class="small muted">Exporta una copia antes del rodaje.</p><div class="controls"><button class="btn" onclick="exportPack()">Exportar JSON</button><label class="btn ghost">Importar JSON<input type="file" accept="application/json" style="display:none" onchange="importPack(this.files[0])"></label></div></div></aside></div>`}

async function saveCfg(){try{await API.post('/api/config',{showTitle:document.getElementById('cfg_title').value,showSubtitle:document.getElementById('cfg_sub').value,playerAName:document.getElementById('cfg_a').value,playerBName:document.getElementById('cfg_b').value,mode:document.getElementById('cfg_mode').value,activePlayer:document.getElementById('cfg_active').value,duelRule:document.getElementById('cfg_duel').value,timerSeconds:Number(document.getElementById('cfg_timer').value||0)},true);toast('Configuración guardada')}catch(e){toast(e.message)}}
function exportPack(){const u=new URL('/api/export',location.origin);u.searchParams.set('pin',hostPin());const c=accessCode();if(c)u.searchParams.set('code',c);location.href=u}
async function importPack(file){if(!file)return;try{await API.post('/api/import',JSON.parse(await file.text()),true);toast('Pack importado')}catch(e){toast(e.message)}}

function render(){if(!latest)return;document.getElementById('host').innerHTML=`<div class="tabs"><button class="tab ${tab==='game'?'active':''}" onclick="setTab('game')">Control en vivo</button><button class="tab ${tab==='questions'?'active':''}" onclick="setTab('questions')">Preguntas</button><button class="tab ${tab==='settings'?'active':''}" onclick="setTab('settings')">Configuración</button></div>`+(tab==='game'?gameTab(latest):tab==='questions'?questionsTab(latest):settingsTab(latest));updateDynamic()}
function updateDynamic(){if(!latest)return;document.querySelectorAll('[data-live-timer]').forEach(el=>{el.textContent=timerLabel(latest);const ms=timerRemaining(latest);el.parentElement?.classList.toggle('danger-time',ms!=null&&ms<=5000&&latest.phase==='open')})}
setInterval(updateDynamic,100);

(async()=>{if(hostPin()){try{latest=await API.state('host');connect();return}catch{sessionStorage.removeItem('focoHostPin')}}openPin()})();
</script></body></html>
