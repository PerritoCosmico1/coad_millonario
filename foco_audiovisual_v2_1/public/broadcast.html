<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02040e"><link rel="manifest" href="/manifest.webmanifest"><title>Salida al aire</title><link rel="stylesheet" href="/styles.css"></head><body class="broadcast-body"><button class="fullscreen-btn" onclick="goFullscreen()">Pantalla completa</button><div id="app"></div><script src="/common.js"></script><script>
let prev=null,latest=null;
function goFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()}
function status(s){return s.phase==='intro'?'Presentación':s.phase==='question'?(s.revealedOptions<4?'Presentando alternativas':'Pregunta lista'):s.phase==='open'?'Respuestas abiertas':s.phase==='locked'?(s.timerExpired?'Tiempo agotado':'Respuestas bloqueadas'):s.phase==='result'?'Resultado':s.message||''}

function playerName(s,p){return p==='A'?s.config.playerAName:s.config.playerBName}
function isWinner(s,p){return !!s.duelResult?.winners?.includes(p)}
function playerBox(s,p,right=false){const name=playerName(s,p),a=s.answers[p],show=s.revealedPlayerAnswers[p]&&a!==null,bump=prev&&prev.winnings[p]!==s.winnings[p],active=s.config.mode==='duel'||s.config.activePlayer===p,winner=s.config.mode==='duel'&&s.correctRevealed&&isWinner(s,p),time=s.responseTimes?.[p];return `<div class="broadcast-player player-${p.toLowerCase()} ${right?'right':''} ${active?'active':''} ${bump?'bump':''} ${winner?'round-winner':''}"><div><div class="name">${esc(name)}</div><div class="cash">${money(s.winnings[p])}</div>${show?`<div class="answer-reveal-pill">Respuesta ${letters[a]}${time!=null?` · ${formatMs(time)}`:''}</div>`:''}${winner?`<div class="winner-tag">GANADOR</div>`:''}</div></div>`}

function ladder(s){return `<aside class="ladder-side">${[['impossible','Imposible'],['hard','Difícil'],['medium','Medio'],['easy','Fácil']].map(([k,l])=>`<div class="ladder-step ${s.question?.difficulty===k?'current':''}"><div class="label">${l}</div><div class="value">${money(s.config.prizeMap[k])}</div></div>`).join('')}</aside>`}

function duelResultPanel(s){if(s.config.mode!=='duel'||!s.correctRevealed||!s.duelResult)return'';const r=s.duelResult,n=p=>playerName(s,p);let headline='SIN GANADOR',sub='Ninguno acertó la respuesta.';if(r.winners.length){headline=r.winners.length===2?`EMPATE · ${esc(n(r.winners[0]))} + ${esc(n(r.winners[1]))}`:`GANA ${esc(n(r.winners[0]))}`;if(r.reason==='fastest'&&r.deltaMs!=null)sub=`Más rápido por ${formatMs(r.deltaMs)}.`;else if(r.reason==='correct')sub='Fue el único en acertar.';else if(r.reason==='all')sub='Ambos acertaron.';else if(r.reason==='tie')sub='Mismo tiempo registrado.'}const times=r.bothCorrect?`<div class="duel-times"><span class="time-a">${esc(playerName(s,'A'))}: <b>${formatMs(r.responseMs.A)}</b></span><span class="delta-time">Δ ${formatMs(r.deltaMs)}</span><span class="time-b">${esc(playerName(s,'B'))}: <b>${formatMs(r.responseMs.B)}</b></span></div>`:'';return `<div class="duel-result-broadcast ${r.winners.length?'has-winner':'no-winner'}"><div class="duel-result-title">${headline}</div><div class="duel-result-sub">${sub}</div>${times}</div>`}

function intro(s){return `<main class="broadcast intro-screen"><header class="broadcast-header"><div class="broadcast-logo">${esc(s.config.showTitle)}</div><div class="mode-chip">${s.config.mode==='duel'?'Duelo':'Modo clásico'}</div></header><div class="intro-content"><div class="intro-orbit"></div><div class="kicker">Comienza el juego</div><h1>${esc(s.config.showTitle)}</h1><p>${esc(s.config.showSubtitle)}</p><div class="intro-players"><div class="intro-player player-a"><span>A</span><b>${esc(s.config.playerAName)}</b></div>${s.config.mode==='duel'?'<div class="intro-vs">VS</div>':''}<div class="intro-player player-b"><span>B</span><b>${esc(s.config.playerBName)}</b></div></div><div class="intro-prizes"><span>FÁCIL <b>${money(s.config.prizeMap.easy)}</b></span><span>MEDIO <b>${money(s.config.prizeMap.medium)}</b></span><span>DIFÍCIL <b>${money(s.config.prizeMap.hard)}</b></span><span>IMPOSIBLE <b>${money(s.config.prizeMap.impossible)}</b></span></div></div></main>`}

function render(s){latest=s;const app=document.getElementById('app');
if(s.phase==='commercial'){app.innerHTML=`<main class="broadcast commercial-screen"><div class="center-screen"><div class="commercial-ring"><div><div class="kicker">Pausa comercial</div><h1>${esc(s.config.showTitle)}</h1><p class="muted">Volvemos en breve</p></div></div></div></main>`;prev=s;return}
if(s.phase==='intro'){app.innerHTML=intro(s);prev=s;return}
if(s.phase==='idle'||!s.question){app.innerHTML=`<main class="broadcast"><div class="center-screen"><div><div class="kicker">Próximamente</div><h1>${esc(s.config.showTitle)}</h1><p class="muted">${esc(s.config.showSubtitle)}</p></div></div></main>`;prev=s;return}

const q=s.question,changed=!prev||prev.question?.id!==q.id,revealChanged=prev&&prev.revealedOptions!==s.revealedOptions,hidden=q.hiddenOptions||[];
const options=q.options.map((o,i)=>{const visible=i<s.revealedOptions,just=revealChanged&&i===s.revealedOptions-1,pickA=s.revealedPlayerAnswers.A&&s.answers.A===i,pickB=s.revealedPlayerAnswers.B&&s.answers.B===i;let c=`broadcast-answer ${visible?'visible':''} ${just?'just-revealed':''}`;if(hidden.includes(i))c+=' eliminated';if(s.config.mode==='duel'){if(pickA&&pickB)c+=' picked-both';else if(pickA)c+=' picked-a';else if(pickB)c+=' picked-b'}else if(pickA||pickB)c+=' player-picked';if(s.correctRevealed&&i===q.correctIndex)c+=' correct';if(s.correctRevealed&&(pickA||pickB)&&i!==q.correctIndex)c+=' wrong-picked';if(s.correctRevealed&&s.config.mode==='duel'&&((pickA&&isWinner(s,'A'))||(pickB&&isWinner(s,'B'))))c+=' winning-choice';const badges=s.config.mode==='duel'&&(pickA||pickB)?`<span class="duel-choice-badges">${pickA?`<i class="pick-a">A</i>`:''}${pickB?`<i class="pick-b">B</i>`:''}</span>`:'';return `<div class="${c}"><span class="letter">${letters[i]}</span><span class="answer-copy">${esc(o)}</span>${badges}</div>`}).join('');

app.innerHTML=`<main class="broadcast"><header class="broadcast-header"><div><div class="broadcast-logo">${esc(s.config.showTitle)}</div><div class="broadcast-sub">${esc(s.config.showSubtitle)}</div></div><div class="broadcast-head-right"><div class="broadcast-timer ${s.phase==='open'?'running':''}"><span>${s.config.timerSeconds?'TIEMPO':'SIN LÍMITE'}</span><b data-live-timer>${timerLabel(s)}</b><div class="timer-bar"><i data-timer-bar></i></div></div><div class="mode-chip">${s.config.mode==='duel'?'Duelo':'Modo clásico'}</div></div></header><section class="broadcast-main"><div><div class="broadcast-meta"><span class="badge ${q.difficulty}">${difficultyLabels[q.difficulty]}</span><span class="badge">${esc(q.category)}</span><span class="badge">${money(q.prize)}</span></div><div class="broadcast-question ${changed?'animate-in':''}">${esc(q.text)}</div><div class="broadcast-answers">${options}</div>${q.hint?`<div class="hint-card"><b>Pista:</b> ${esc(q.hint)}</div>`:''}${duelResultPanel(s)}</div>${ladder(s)}</section><footer class="broadcast-footer">${playerBox(s,'A')}<div class="broadcast-status">${esc(status(s))}</div>${playerBox(s,'B',true)}</footer></main>`;
prev=s;updateDynamic()}

function updateDynamic(){if(!latest)return;document.querySelectorAll('[data-live-timer]').forEach(el=>{el.textContent=timerLabel(latest);const ms=timerRemaining(latest),danger=ms!=null&&ms<=5000&&latest.phase==='open';el.closest('.broadcast-timer')?.classList.toggle('danger-time',danger)});document.querySelectorAll('[data-timer-bar]').forEach(el=>{if(!latest.config.timerSeconds){el.style.width='100%';return}const total=latest.config.timerSeconds*1000,ms=timerRemaining(latest);el.style.width=`${Math.max(0,Math.min(100,(ms??total)/total*100))}%`})}
setInterval(updateDynamic,100);

const stream=API.stream('display','',render,()=>{});
window.addEventListener('beforeunload',()=>stream.close());
</script></body></html>
