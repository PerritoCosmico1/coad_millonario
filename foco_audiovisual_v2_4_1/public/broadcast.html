<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02040e"><link rel="manifest" href="/manifest.webmanifest?v=2.4.1"><title>FOCO · Emisión</title><link rel="stylesheet" href="/styles.css?v=2.4.1"></head>
<body class="broadcast-body"><button class="fullscreen-btn" onclick="goFullscreen()">Pantalla completa</button><div id="app"></div><script src="/common.js?v=2.4.1"></script><script>
let prev=null,latest=null,seenLifeEventId=null,seenLifelineEventId=null;
function goFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()}
function pname(s,p){return p==='A'?s.config.playerAName:s.config.playerBName}
function shortMark(s,p){const clean=n=>n.trim().replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9 ]/g,'').split(/\s+/).filter(Boolean);const a=clean(pname(s,p)),first=(a[0]?.[0]||p).toUpperCase(),other=p==='A'?'B':'A',b=clean(pname(s,other)),otherFirst=(b[0]?.[0]||other).toUpperCase();if(first!==otherFirst)return first;return (a[0]||p).toUpperCase().slice(0,2)}
function isWinner(s,p){return !!s.duelResult?.winners?.includes(p)}
function status(s){const x={question:s.revealedOptions<4?'Presentando alternativas':'Pregunta lista',open:'Respuestas abiertas',locked:s.timerExpired?'Tiempo agotado':'Respuestas bloqueadas',result:'Resultado'};return x[s.phase]||s.message||''}
function pts(n){return `${Number(n||0)} ${Number(n||0)===1?'PTO':'PTS'}`}
function longClass(text,medium=95,long=165){const n=String(text||'').length;return n>long?'very-long':n>medium?'long':''}
function lifeStrip(s,p,animate=false){if(!s.config.classicLivesEnabled)return'';const total=s.config.classicStartingLives,remain=s.lives[p],event=s.lifeEvent,justLost=animate&&event?.player===p;return `<div class="broadcast-lives ${remain===1?'last-life':''} ${justLost?'life-strip-hit':''}">${Array.from({length:total},(_,i)=>{const lost=justLost&&i===event.after;return `<span class="life-heart ${i<remain?'alive':'spent'} ${lost?'just-lost':''}">♥</span>`}).join('')}<b>${remain}/${total}</b>${remain===1?'<em>ÚLTIMA VIDA</em>':''}</div>`}
function duelPot(s,compact=false){if(s.config.mode!=='duel'||!s.config.duelPointsEnabled)return'';return `<div class="tv-pot ${compact?'compact':''}"><span>POZO</span><b>${money(s.config.duelPrizePot)}</b></div>`}
function roundValue(s,q){if(s.config.mode==='duel'&&s.config.duelPointsEnabled)return `<span class="round-value points">+${s.config.pointMap[q.difficulty]} PTS</span>`;return `<span class="round-value">${money(q.prize)}</span>`}

function playerBox(s,p,right=false,lifeNew=false){const name=pname(s,p),a=s.answers[p],show=s.revealedPlayerAnswers[p]&&a!==null,duelPts=s.config.mode==='duel'&&s.config.duelPointsEnabled;const oldMetric=duelPts?prev?.points?.[p]:prev?.winnings?.[p],newMetric=duelPts?s.points[p]:s.winnings[p],bump=prev&&oldMetric!==newMetric,winner=s.config.mode==='duel'&&s.correctRevealed&&isWinner(s,p),time=s.responseTimes?.[p];const metric=duelPts?`<div class="broadcast-points">${pts(s.points[p])}</div>`:`<div class="cash">${money(s.winnings[p])}</div>`;const award=duelPts&&s.pointEvent?.winners?.includes(p)?`<div class="point-pop">+${s.pointEvent.value}</div>`:'';return `<div class="broadcast-player tv-player player-${p.toLowerCase()} ${right?'right':''} ${bump?'bump':''} ${winner?'round-winner':''} ${s.eliminated[p]?'eliminated':''}"><div class="player-mark">${shortMark(s,p)}</div><div class="player-copy"><div class="name">${esc(name)}</div>${metric}${s.config.mode==='classic'?lifeStrip(s,p,lifeNew):''}${show?`<div class="answer-reveal-pill">${letters[a]}${time!=null?` · ${formatMs(time)}`:''}</div>`:''}</div>${winner?`<div class="winner-tag">RONDA</div>`:''}${s.eliminated[p]?`<div class="eliminated-label">FUERA</div>`:''}${award}</div>`}
function progressRail(s){const levels=[['easy','Fácil'],['medium','Medio'],['hard','Difícil'],['impossible','Imposible']];return `<div class="tv-progress">${levels.map(([k,l],i)=>{const current=s.question?.difficulty===k||s.pendingDifficulty===k;const val=s.config.mode==='duel'&&s.config.duelPointsEnabled?`${s.config.pointMap[k]} pts`:money(s.config.prizeMap[k]);return `<div class="tv-progress-step ${current?'current':''}"><i>${i+1}</i><span>${l}</span><b>${val}</b></div>`}).join('')}</div>`}
function topHeader(s,q=null,label=''){return `<header class="tv-header"><div class="tv-show-bug"><b>${esc(s.config.showTitle)}</b><span>${esc(s.config.showSubtitle)}</span></div><div class="tv-round-id">${label||((s.roundIndex>=0?`RONDA ${s.roundIndex+1}/${s.roundSequence.length}`:'EN ESPERA'))}${q?` · ${difficultyLabels[q.difficulty].toUpperCase()}`:''}</div>${s.config.mode==='duel'&&s.config.duelPointsEnabled?duelPot(s,true):`<div class="tv-mode-bug">${s.config.mode==='duel'?'DUELO':'CLÁSICO'}</div>`}</header>`}

function intro(s){const active=s.config.activePlayer,players=s.config.mode==='duel'?`<div class="intro-player player-a"><span>${shortMark(s,'A')}</span><b>${esc(pname(s,'A'))}</b></div><div class="intro-vs">VS</div><div class="intro-player player-b"><span>${shortMark(s,'B')}</span><b>${esc(pname(s,'B'))}</b></div>`:`<div class="intro-player player-${active.toLowerCase()} solo"><span>${shortMark(s,active)}</span><b>${esc(pname(s,active))}</b></div>`;const rule=s.config.mode==='duel'&&s.config.duelPointsEnabled?`PUNTOS · ${s.config.pointMap.easy}/${s.config.pointMap.medium}/${s.config.pointMap.hard}/${s.config.pointMap.impossible}`:s.config.mode==='duel'?'DUELO POR PREMIOS':s.config.classicLivesEnabled?`${s.config.classicStartingLives} VIDAS`:'SIN VIDAS';const moneyLine=s.config.mode==='duel'&&s.config.duelPointsEnabled?`<div class="intro-pot"><span>POZO TOTAL</span><b>${money(s.config.duelPrizePot)}</b><small>El ganador del Duelo se lleva el pozo</small></div>`:`<div class="intro-prizes"><span>FÁCIL <b>${money(s.config.prizeMap.easy)}</b></span><span>MEDIO <b>${money(s.config.prizeMap.medium)}</b></span><span>DIFÍCIL <b>${money(s.config.prizeMap.hard)}</b></span><span>IMPOSIBLE <b>${money(s.config.prizeMap.impossible)}</b></span></div>`;return `<main class="broadcast tv-stage intro-screen">${topHeader(s,null,'APERTURA')}<div class="intro-content"><div class="tv-light-sweep"></div><div class="intro-orbit"></div><div class="kicker">Comienza el juego</div><h1>${esc(s.config.showTitle)}</h1><p>${esc(s.config.showSubtitle)}</p><div class="intro-players">${players}</div><div class="intro-rule-chip">${rule}</div>${moneyLine}</div></main>`}
function categoryScreen(s){const active=s.config.activePlayer,chosen=s.selectedCategory;return `<main class="broadcast tv-stage category-screen">${topHeader(s,null,'ELECCIÓN DE CATEGORÍA')}<div class="category-stage"><div class="kicker">${esc(pname(s,active))} · ${difficultyLabels[s.pendingDifficulty]}</div><h1>${chosen?'HA ELEGIDO':'ELIGE TU CATEGORÍA'}</h1><div class="category-stage-grid">${s.availableCategories.map(c=>`<div class="category-stage-card ${chosen===c?'chosen':''}">${esc(c)}</div>`).join('')}</div>${chosen?`<div class="category-confirmed">${esc(chosen)}</div>`:''}</div></main>`}
function duelResultPanel(s){if(s.config.mode!=='duel'||!s.correctRevealed||!s.duelResult)return'';const r=s.duelResult;let headline='SIN GANADOR',sub='Ninguno acertó la respuesta.';if(r.winners.length){headline=r.winners.length===2?'EMPATE DE RONDA':`GANA ${esc(pname(s,r.winners[0]))}`;if(r.reason==='fastest'&&r.deltaMs!=null)sub=`Diferencia: ${formatMs(r.deltaMs)}`;else if(r.reason==='correct')sub='Único acierto de la ronda';else if(r.reason==='all')sub='Ambos acertaron';else if(r.reason==='tie')sub='Mismo tiempo registrado'}if(s.config.duelPointsEnabled&&r.winners.length)sub+=` · +${r.pointsAwarded} ${r.pointsAwarded===1?'punto':'puntos'}`;const times=r.bothCorrect?`<div class="duel-times"><span class="time-a">${esc(pname(s,'A'))} <b>${formatMs(r.responseMs.A)}</b></span><span class="delta-time">Δ ${formatMs(r.deltaMs)}</span><span class="time-b"><b>${formatMs(r.responseMs.B)}</b> ${esc(pname(s,'B'))}</span></div>`:'';const leader=s.config.duelPointsEnabled&&s.pointEvent?.leaderChanged?`<div class="leader-change">NUEVO LÍDER · ${esc(pname(s,s.pointEvent.newLeader))}</div>`:'';return `<div class="duel-result-broadcast ${r.winners.length?'has-winner':'no-winner'}"><div><div class="duel-result-title">${headline}</div><div class="duel-result-sub">${sub}</div></div>${times}${leader}</div>`}
function lifeEventCue(s,isNew){const e=s.lifeEvent;if(!e||!isNew)return'';seenLifeEventId=e.id;const title=e.zero?'SIN VIDAS':e.lastLife?'ÚLTIMA VIDA':'VIDA PERDIDA',sub=e.zero?(s.config.classicZeroLivesMode==='end'?'Fin de la partida':'Continúa fuera de competencia'):`${e.after} ${e.after===1?'vida restante':'vidas restantes'}`;return `<div class="life-event-band ${e.zero?'zero':e.lastLife?'last':''}"><div class="life-event-pulse">♥</div><div><b>${title}</b><span>${esc(pname(s,e.player))} · ${sub}</span></div>${lifeStrip(s,e.player,true)}</div>`}
function lifelineCue(s,isNew){const e=s.lifelineEvent;if(!e||!isNew)return'';seenLifelineEventId=e.id;const labels={fifty:'50 / 50',hint:'PISTA',swap:'CAMBIO DE PREGUNTA'};return `<div class="lifeline-tv-cue lifeline-${e.type}"><span>COMODÍN</span><b>${labels[e.type]||'COMODÍN'}</b></div>`}

function summaryScreen(s){const sum=s.summary,stats=sum.stats;const playerStat=p=>{const primary=s.config.mode==='duel'&&s.config.duelPointsEnabled?`<div class="summary-money summary-points">${pts(stats[p].points)}</div>`:`<div class="summary-money">${money(stats[p].winnings)}</div>`;const life=s.config.mode==='classic'&&s.config.classicLivesEnabled?`<span>Vidas <b>${stats[p].lives}/${s.config.classicStartingLives}</b></span>`:'';const pot=s.config.mode==='duel'&&s.config.duelPointsEnabled&&stats[p].prizeWon?`<div class="summary-prize-line pot-won">Pozo adjudicado · <b>${money(stats[p].prizeWon)}</b></div>`:'';return `<div class="summary-player player-${p.toLowerCase()}"><div class="summary-name">${esc(pname(s,p))}</div>${primary}<div class="summary-grid"><span>Aciertos <b>${stats[p].correct}</b></span><span>Rondas <b>${stats[p].roundWins}</b></span><span>Promedio <b>${formatMs(stats[p].avgResponseMs)}</b></span>${life}</div>${s.config.mode==='classic'?`<div class="summary-prize-line">Escalón alcanzado · <b>${money(stats[p].winnings)}</b></div>`:pot}</div>`};return `<main class="broadcast tv-stage end-screen summary-screen">${topHeader(s,null,'RESUMEN FINAL')}<div class="end-content"><div class="kicker">Partida completada</div><h1>ASÍ TERMINÓ EL JUEGO</h1>${s.config.mode==='duel'&&s.config.duelPointsEnabled?`<div class="summary-pot">POZO · <b>${money(s.config.duelPrizePot)}</b></div>`:''}<div class="summary-players">${s.config.mode==='duel'?playerStat('A')+playerStat('B'):playerStat(s.config.activePlayer)}</div></div></main>`}
function finalScreen(s){const out=s.summary.outcome;if(s.config.mode==='duel'){const metric=p=>s.config.duelPointsEnabled?pts(s.points[p]):money(s.winnings[p]);if(out.type==='tie')return `<main class="broadcast tv-stage end-screen final-screen tie"><div class="end-content"><div class="kicker">Resultado definitivo</div><h1>EMPATE</h1><p>${esc(pname(s,'A'))} · ${metric('A')} &nbsp; / &nbsp; ${esc(pname(s,'B'))} · ${metric('B')}</p>${s.config.duelPointsEnabled?`<div class="final-pot unclaimed"><span>POZO SIN ADJUDICAR</span><b>${money(s.config.duelPrizePot)}</b></div>`:''}</div></main>`;const p=out.winners[0];return `<main class="broadcast tv-stage end-screen final-screen victory"><div class="end-content"><div class="kicker">Resultado definitivo</div><h1>CAMPEÓN</h1><h2>${esc(pname(s,p))}</h2>${s.config.duelPointsEnabled?`<div class="final-pot"><span>SE LLEVA EL POZO</span><b>${money(s.config.duelPrizePot)}</b></div><div class="final-score">${pts(s.points[p])}</div>`:`<div class="final-money">${metric(p)}</div>`}</div></main>`}
const p=s.config.activePlayer,won=out.type==='victory';return `<main class="broadcast tv-stage end-screen final-screen ${won?'victory':'defeat'}"><div class="end-content"><div class="kicker">Resultado definitivo</div><h1>${won?'VICTORIA':'FIN DEL JUEGO'}</h1><h2>${esc(pname(s,p))}</h2><div class="final-money">${money(s.winnings[p])}</div>${s.config.classicLivesEnabled?`<div class="final-lives">${lifeStrip(s,p)}</div>`:''}<p>${won?'Superaste la ronda final con vidas disponibles.':s.eliminated[p]?'Te quedaste sin vidas.':'La última ronda no fue superada.'}</p></div></main>`}

function render(s){latest=s;const app=document.getElementById('app');
if(s.phase==='commercial'){app.innerHTML=`<main class="broadcast tv-stage commercial-screen"><div class="commercial-center"><div class="commercial-ring"><div><div class="kicker">Pausa comercial</div><h1>${esc(s.config.showTitle)}</h1><p class="muted">Volvemos en breve</p></div></div></div></main>`;prev=s;return}
if(s.phase==='intro'){app.innerHTML=intro(s);prev=s;return}
if(s.phase==='category'||s.phase==='categoryChosen'){app.innerHTML=categoryScreen(s);prev=s;return}
if(s.phase==='summary'){app.innerHTML=summaryScreen(s);prev=s;return}
if(s.phase==='final'){app.innerHTML=finalScreen(s);prev=s;return}
if(s.phase==='idle'||!s.question){app.innerHTML=`<main class="broadcast tv-stage standby-screen">${topHeader(s,null,'EN ESPERA')}<div class="center-screen"><div><div class="kicker">Próximamente</div><h1>${esc(s.config.showTitle)}</h1><p class="muted">${esc(s.config.showSubtitle)}</p></div></div></main>`;prev=s;return}

const q=s.question,changed=!prev||prev.question?.id!==q.id||prev.question?.variant!==q.variant,revealChanged=prev&&prev.revealedOptions!==s.revealedOptions,hidden=q.hiddenOptions||[],lifeNew=!!s.lifeEvent&&s.lifeEvent.id!==seenLifeEventId,lifelineNew=!!s.lifelineEvent&&s.lifelineEvent.id!==seenLifelineEventId;
const ma=shortMark(s,'A'),mb=shortMark(s,'B'),fiftyNow=s.lifelineEvent?.type==='fifty'&&s.lifelineEvent.id===(!prev?.lifelineEvent?.id?s.lifelineEvent.id:(prev.lifelineEvent.id!==s.lifelineEvent.id?s.lifelineEvent.id:null));
const options=q.options.map((o,i)=>{const visible=i<s.revealedOptions,just=revealChanged&&i===s.revealedOptions-1,pickA=s.revealedPlayerAnswers.A&&s.answers.A===i,pickB=s.revealedPlayerAnswers.B&&s.answers.B===i;let c=`broadcast-answer ${visible?'visible':''} ${just?'just-revealed':''} ${longClass(o,46,84)}`;if(hidden.includes(i))c+=` eliminated ${lifelineNew&&s.lifelineEvent?.type==='fifty'?'fifty-eliminated':''}`;if(s.config.mode==='duel'){if(pickA&&pickB)c+=' picked-both';else if(pickA)c+=' picked-a';else if(pickB)c+=' picked-b'}else if((s.config.activePlayer==='A'&&pickA)||(s.config.activePlayer==='B'&&pickB))c+=' player-picked';if(s.correctRevealed&&i===q.correctIndex)c+=' correct';if(s.correctRevealed&&(pickA||pickB)&&i!==q.correctIndex)c+=' wrong-picked';if(s.correctRevealed&&s.config.mode==='duel'&&((pickA&&isWinner(s,'A'))||(pickB&&isWinner(s,'B'))))c+=' winning-choice';const badges=s.config.mode==='duel'&&(pickA||pickB)?`<span class="duel-choice-badges">${pickA?`<i class="pick-a">${esc(ma)}</i>`:''}${pickB?`<i class="pick-b">${esc(mb)}</i>`:''}</span>`:'';return `<div class="${c}" style="--answer-index:${i}"><span class="letter">${letters[i]}</span><span class="answer-copy">${esc(o)}</span>${badges}</div>`}).join('');
const footer=s.config.mode==='duel'?`${playerBox(s,'A',false,false)}<div class="broadcast-status">${esc(status(s))}</div>${playerBox(s,'B',true,false)}`:`${playerBox(s,s.config.activePlayer,false,lifeNew)}<div class="broadcast-status">${esc(status(s))}</div><div class="tv-footer-spacer"></div>`;
const meta=s.config.mode==='duel'&&s.config.duelPointsEnabled?`<span class="badge ${q.difficulty}">${difficultyLabels[q.difficulty]}</span><span class="badge">${esc(q.category)}</span>${roundValue(s,q)}`:`<span class="badge ${q.difficulty}">${difficultyLabels[q.difficulty]}</span><span class="badge">${esc(q.category)}</span>${roundValue(s,q)}`;
app.innerHTML=`<main class="broadcast tv-stage game-screen mode-${s.config.mode}">${topHeader(s,q)}${progressRail(s)}<section class="tv-game-area"><div class="tv-meta">${meta}</div><div class="broadcast-timer broadcast-timer-center ${s.phase==='open'?'running':''}" data-timer-wrap><span>${s.config.timerSeconds?'TIEMPO RESTANTE':'SIN LÍMITE'}</span><b data-live-timer>${timerLabel(s)}</b><div class="timer-bar"><i data-timer-bar></i></div></div><div class="broadcast-question ${changed?'animate-in':''} ${longClass(q.text,115,210)}">${esc(q.text)}</div><div class="broadcast-answers">${options}</div>${q.hint?`<div class="hint-card"><b>Pista</b><span>${esc(q.hint)}</span></div>`:''}${duelResultPanel(s)}</section><footer class="broadcast-footer tv-scoreboard">${footer}</footer>${lifeEventCue(s,lifeNew)}${lifelineCue(s,lifelineNew)}</main>`;prev=s;updateDynamic()}
function updateDynamic(){if(!latest)return;const ms=timerRemaining(latest),urgent=ms!=null&&ms<=10000&&latest.phase==='open',critical=ms!=null&&ms<=5000&&latest.phase==='open';document.querySelectorAll('[data-live-timer]').forEach(el=>el.textContent=timerLabel(latest));document.querySelectorAll('[data-timer-wrap]').forEach(el=>{el.classList.toggle('danger-time',urgent);el.classList.toggle('critical-time',critical)});document.querySelectorAll('[data-timer-bar]').forEach(el=>{if(!latest.config.timerSeconds){el.style.width='100%';return}const total=latest.config.timerSeconds*1000;el.style.width=`${Math.max(0,Math.min(100,(ms??total)/total*100))}%`})}
setInterval(updateDynamic,100);const stream=API.stream('display','',render,()=>{});window.addEventListener('beforeunload',()=>stream.close());
</script></body></html>
