<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#040714"><link rel="manifest" href="/manifest.webmanifest">
<title>FOCO V2.3 · Control</title><link rel="stylesheet" href="/styles.css">
</head>
<body><div class="shell">
<header class="topbar"><a class="brand" href="/">FOCO <span>CONTROL V2.3</span></a>
<div class="top-actions"><button class="btn ghost" onclick="copyLink('/broadcast.html')">Copiar TV</button><button class="btn ghost" onclick="copyLink('/player.html?player=A')">Link A</button><button class="btn ghost" onclick="copyLink('/player.html?player=B')">Link B</button><button class="btn warn" onclick="act('commercial')">Comercial</button></div>
</header><main class="container host-wrap"><div id="host"></div></main></div>
<div id="pinModal" class="modal"><div class="modal-card"><div class="kicker">Acceso de producción</div><h2>Panel del anfitrión</h2><div class="field"><label>PIN</label><input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN"></div><button class="btn primary block" style="margin-top:12px" onclick="login()">Entrar</button><p class="small muted pin-default-note">PIN predeterminado: <b>0000</b>. Si ya lo cambiaste en Configuración, usa tu PIN actual.</p><p id="pinError" class="small" style="color:var(--red)"></p></div></div>
<script src="/common.js"></script><script>
let latest=null,stream=null,tab='game',editing=-1,qFilterCat='all',qFilterDiff='all';

function openPin(){document.getElementById('pinModal').classList.add('open')}
async function login(){sessionStorage.setItem('focoHostPin',document.getElementById('pinInput').value.trim());try{await API.state('host');document.getElementById('pinModal').classList.remove('open');connect()}catch(e){sessionStorage.removeItem('focoHostPin');document.getElementById('pinError').textContent=e.message}}
function connect(){stream?.close();stream=API.stream('host','',s=>{latest=s;render()},()=>{})}
async function act(action,extra={}){try{return await API.post('/api/action',{action,...extra},true)}catch(e){toast(e.message);return null}}
function setTab(t){tab=t;render()}
function copyLink(path){const u=new URL(path,location.origin),c=accessCode();if(c)u.searchParams.set('code',c);navigator.clipboard?.writeText(u).then(()=>toast('Link copiado')).catch(()=>prompt('Copia este link',u))}
function pname(s,p){return p==='A'?s.config.playerAName:s.config.playerBName}
function phaseLabel(s){const m={idle:'En espera',intro:'Apertura',category:'Elegir categoría',categoryChosen:'Categoría elegida',question:'Presentando pregunta',open:'Respuestas abiertas',locked:s.timerExpired?'Tiempo agotado':'Respuestas bloqueadas',result:'Resultado',summary:'Resumen final',final:'Cierre',commercial:'Comerciales'};return m[s.phase]||s.phase}
function roundLabel(s){return s.roundIndex>=0?`Ronda ${s.roundIndex+1}/${s.roundSequence.length}`:'Antes de comenzar'}
function compactTimer(s){return s.phase==='open'?` · ${timerLabel(s)}s`:''}
function pointsText(n){return `${Number(n||0)} ${Number(n||0)===1?'pto':'pts'}`}
function heartStrip(s,p,small=false){if(!s.config.classicLivesEnabled)return'';const total=s.config.classicStartingLives,remain=s.lives[p];return `<div class="life-strip ${small?'small':''}" aria-label="${remain} vidas restantes">${Array.from({length:total},(_,i)=>`<span class="life-heart ${i<remain?'alive':'spent'}">♥</span>`).join('')}<b>${remain}/${total}</b></div>`}

function playerMini(s,p){const active=s.config.mode==='duel'||s.config.activePlayer===p,a=s.answers[p],time=s.responseTimes?.[p];const metric=s.config.mode==='duel'&&s.config.duelPointsEnabled?`<div class="score-points">${pointsText(s.points[p])}</div>`:`<div class="cash">${money(s.winnings[p])}</div>`;return `<div class="player-mini player-${p.toLowerCase()} ${active?'active':''} ${s.eliminated[p]?'eliminated':''}"><div class="small muted">${esc(pname(s,p))}</div>${metric}${s.config.mode==='classic'&&active?heartStrip(s,p,true):''}<div class="choice">${a===null?'Sin respuesta':`Eligió ${letters[a]}`}${s.revealedPlayerAnswers[p]?' · revelada':''}</div>${a!==null?`<div class="response-time">${formatMs(time)}</div>`:''}${s.eliminated[p]?'<div class="eliminated-tag">FUERA DE COMPETENCIA</div>':''}</div>`}
function ladder(s){return `<div class="prize-ladder">${[['impossible','Imposible'],['hard','Difícil'],['medium','Medio'],['easy','Fácil']].map(([k,l])=>`<div class="prize-step ${s.question?.difficulty===k||s.pendingDifficulty===k?'current':''}"><span class="badge ${k}">${l}</span><span class="amount">${money(s.config.prizeMap[k])}</span>${s.config.mode==='duel'&&s.config.duelPointsEnabled?`<span class="step-points">${s.config.pointMap[k]} pts</span>`:''}</div>`).join('')}</div>`}

function lifelineAllowed(s,p){return s.config.mode==='classic'&&p===s.config.activePlayer&&s.phase==='open'&&s.answers[p]===null&&!s.correctRevealed&&s.revealedOptions===4&&!s.eliminated[p]}
function lifelines(s){if(s.config.mode!=='classic')return'';const p=s.config.activePlayer,lf=s.lifelines[p],ok=lifelineAllowed(s,p);return `<div class="section-label">Comodines · ${esc(pname(s,p))}</div><div class="action-grid three"><button class="btn" ${ok&&lf.fifty?'':'disabled'} onclick="act('useLifeline',{player:'${p}',type:'fifty'})">50 / 50</button><button class="btn" ${ok&&lf.hint?'':'disabled'} onclick="act('useLifeline',{player:'${p}',type:'hint'})">Pista</button><button class="btn" ${ok&&lf.swap?'':'disabled'} onclick="act('useLifeline',{player:'${p}',type:'swap'})">Cambiar pregunta</button></div><p class="small muted">Solo disponibles con respuestas abiertas, antes de marcar una opción y mientras el concursante siga en competencia.</p>`}

function categoryPanel(s){const chosen=s.selectedCategory;return `<div class="category-control"><div class="section-label">Elección en vivo · ${difficultyLabels[s.pendingDifficulty]||''}</div><div class="category-grid">${s.availableCategories.map(c=>`<button class="btn category-btn ${chosen===c?'selected':''}" ${s.phase==='categoryChosen'?'disabled':''} onclick="act('chooseCategory',{category:'${esc(c)}'})">${esc(c)}</button>`).join('')}</div>${s.phase==='categoryChosen'?`<div class="chosen-category">Elegida: <b>${esc(chosen)}</b></div><button class="btn primary block" onclick="act('confirmCategory')">Confirmar y preparar pregunta</button>`:'<p class="small muted">El concursante activo también puede elegirla desde su dispositivo.</p>'}</div>`}

function questionControls(s){const q=s.question;if(!q)return '';
const opts=q.options.map((o,i)=>`<div class="host-answer ${i<s.revealedOptions?'shown':''} ${s.correctRevealed&&i===q.correctIndex?'correct':''}"><b>${letters[i]}</b> ${esc(o)}</div>`).join('');
const revealPlayers=s.config.mode==='duel'?`<button class="btn player-a-btn" ${s.revealedPlayerAnswers.A||!['locked','result'].includes(s.phase)?'disabled':''} onclick="act('revealPlayerAnswer',{player:'A'})">Revelar ${esc(pname(s,'A'))}</button><button class="btn player-b-btn" ${s.revealedPlayerAnswers.B||!['locked','result'].includes(s.phase)?'disabled':''} onclick="act('revealPlayerAnswer',{player:'B'})">Revelar ${esc(pname(s,'B'))}</button>`:`<button class="btn" ${s.revealedPlayerAnswers[s.config.activePlayer]||!['locked','result'].includes(s.phase)?'disabled':''} onclick="act('revealPlayerAnswer',{player:'${s.config.activePlayer}'})">Revelar respuesta</button>`;
const reward=s.config.mode==='duel'&&s.config.duelPointsEnabled?`+${s.config.pointMap[q.difficulty]} pts`:`${money(q.prize)}`;
return `<div class="live-question"><div class="broadcast-meta"><span class="badge ${q.difficulty}">${difficultyLabels[q.difficulty]}</span><span class="badge">${esc(q.category)}</span><span class="badge">${money(q.prize)}</span>${s.config.mode==='duel'&&s.config.duelPointsEnabled?`<span class="badge points-badge">${s.config.pointMap[q.difficulty]} PTS</span>`:''}${q.variant==='alternate'?'<span class="badge warn">ALTERNATIVA</span>':''}</div><h2>${esc(q.text)}</h2><div class="host-answer-grid">${opts}</div></div>
<div class="section-label">Flujo de la ronda</div><div class="action-grid three">
<button class="btn" ${s.phase!=='question'||s.revealedOptions>=4?'disabled':''} onclick="act('revealNextOption')">Revelar siguiente</button>
<button class="btn" ${s.phase!=='question'||s.revealedOptions>=4?'disabled':''} onclick="act('revealAllOptions')">Revelar todas</button>
<button class="btn primary" ${s.phase!=='question'||s.revealedOptions<4?'disabled':''} onclick="act('openAnswers')">Abrir respuestas</button>
<button class="btn warn" ${s.phase!=='open'?'disabled':''} onclick="act('lockAnswers')">Bloquear</button>
${revealPlayers}
<button class="btn good" ${s.correctRevealed||!['locked','result'].includes(s.phase)?'disabled':''} onclick="act('revealCorrect')">Revelar correcta · ${reward}</button>
</div>${lifelines(s)}
${s.phase==='result'?`<div class="next-round-box"><button class="btn primary block" onclick="act('nextQuestion')">${s.gameOver?'Ir al resumen · sin vidas':s.roundIndex+1>=s.roundSequence.length?'Ir al resumen final':'Siguiente ronda →'}</button></div>`:''}`}

function emergencyPanel(s){const duelPts=s.config.mode==='duel'&&s.config.duelPointsEnabled,classicLives=s.config.mode==='classic'&&s.config.classicLivesEnabled;return `<details class="emergency"><summary>Corrección de emergencia</summary><div class="form-grid emergency-grid">
<div class="field"><label>Ajuste de dinero / escalón</label><input id="corr" type="number" value="250000" step="50000"><div class="controls"><button class="btn good" onclick="correctionMoney('A',1)">+ A</button><button class="btn danger" onclick="correctionMoney('A',-1)">− A</button><button class="btn good" onclick="correctionMoney('B',1)">+ B</button><button class="btn danger" onclick="correctionMoney('B',-1)">− B</button></div></div>
${duelPts?`<div class="field"><label>Ajuste de puntos</label><input id="corrPts" type="number" value="1" min="1" step="1"><div class="controls"><button class="btn good" onclick="correctionPoints('A',1)">+ A</button><button class="btn danger" onclick="correctionPoints('A',-1)">− A</button><button class="btn good" onclick="correctionPoints('B',1)">+ B</button><button class="btn danger" onclick="correctionPoints('B',-1)">− B</button></div></div>`:''}
${classicLives?`<div class="field"><label>Vidas · ${esc(pname(s,s.config.activePlayer))}</label><div class="controls"><button class="btn good" onclick="act('adjustLives',{player:'${s.config.activePlayer}',delta:1})">+ vida</button><button class="btn danger" onclick="act('adjustLives',{player:'${s.config.activePlayer}',delta:-1})">− vida</button></div></div>`:''}
<div class="field"><label>Override de tiempo (seg)</label><div class="controls"><input id="emTimer" type="number" min="0" max="300" value="${s.config.timerSeconds}"><button class="btn" onclick="emergencyTimer()">Aplicar</button></div></div>
<div class="field"><label>Ronda</label><button class="btn" onclick="act('resetRound')">Reiniciar ronda actual</button></div>
</div><button class="btn danger" onclick="resetGame()">Reiniciar partida completa</button></details>`}

function gameTab(s){let body='';
if(s.phase==='idle') body=`<div class="empty-live"><div class="kicker">Listo para producción</div><h2>${esc(s.config.showTitle)}</h2><p class="muted">La configuración ya está cargada. “Preparar” lanza la apertura antes de la primera pregunta.</p><button class="btn primary big" onclick="act('prepareShow')">Preparar · mostrar apertura</button></div>`;
else if(s.phase==='intro') body=`<div class="empty-live"><div class="kicker">Apertura al aire</div><h2>Presentación en emisión</h2><p class="muted">${s.config.mode==='classic'?`Se presenta solo a ${esc(pname(s,s.config.activePlayer))}.`:'Se presentan ambos concursantes.'}</p><button class="btn primary big" onclick="act('startShow')">Comenzar primera ronda</button></div>`;
else if(s.phase==='category'||s.phase==='categoryChosen') body=categoryPanel(s);
else if(s.phase==='summary') body=`<div class="empty-live"><div class="kicker">Resumen al aire</div><h2>Partida completada</h2><p class="muted">La emisión está mostrando estadísticas de la partida.</p><button class="btn primary big" onclick="act('showFinal')">Mostrar cierre definitivo</button></div>`;
else if(s.phase==='final') body=`<div class="empty-live"><div class="kicker">Cierre al aire</div><h2>Programa finalizado</h2><p class="muted">Puedes dejar esta pantalla, ir a comerciales o reiniciar cuando termine el bloque.</p></div>`;
else if(s.phase==='commercial') body=`<div class="empty-live"><div class="kicker">Pausa comercial</div><h2>La emisión está en comerciales</h2><button class="btn warn big" onclick="act('commercial')">Volver al juego</button></div>`;
else body=questionControls(s);
const cards=s.config.mode==='classic'?playerMini(s,s.config.activePlayer):playerMini(s,'A')+playerMini(s,'B');
return `<div class="host-grid host-live-grid"><section class="panel"><div class="panel-title"><div><div class="kicker">${roundLabel(s)}</div><h2>${phaseLabel(s)}${compactTimer(s)}</h2></div><span class="badge">${s.config.mode==='duel'?'DUELO':'CLÁSICO'}</span></div>${body}${emergencyPanel(s)}</section><aside><div class="panel"><div class="status-grid ${s.config.mode==='classic'?'solo-status':''}">${cards}</div><div class="section-label">${s.config.mode==='duel'&&s.config.duelPointsEnabled?'Valor de las rondas':'Escalera'}</div>${ladder(s)}</div></aside></div>`}

function correctionMoney(p,sign){const n=Math.abs(Number(document.getElementById('corr')?.value||0));if(!n)return toast('Ingresa un monto');act('adjustScore',{player:p,delta:n*sign})}
function correctionPoints(p,sign){const n=Math.abs(Number(document.getElementById('corrPts')?.value||0));if(!n)return toast('Ingresa puntos');act('adjustPoints',{player:p,delta:n*sign})}
function emergencyTimer(){const n=Number(document.getElementById('emTimer')?.value);if(!Number.isFinite(n)||n<0)return toast('Tiempo inválido');act('setTimer',{seconds:n})}
function resetGame(){if(confirm('¿Reiniciar la partida completa?'))act('resetGame')}

function filteredQuestions(s){return s.questions.filter(q=>(qFilterCat==='all'||q.category===qFilterCat)&&(qFilterDiff==='all'||q.difficulty===qFilterDiff))}
function questionsTab(s){const cats=[...new Set(s.questions.map(q=>q.category))].sort((a,b)=>a.localeCompare(b,'es')),list=filteredQuestions(s);return `<div class="host-grid"><section class="panel"><div class="panel-title"><div><div class="kicker">Pool del programa</div><h2>Banco de preguntas · ${s.questions.length}</h2></div><button class="btn primary" onclick="newQ()">Nueva pregunta</button></div>
<div class="filter-row"><select onchange="qFilterCat=this.value;render()"><option value="all">Todas las categorías</option>${cats.map(c=>`<option ${qFilterCat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select onchange="qFilterDiff=this.value;render()"><option value="all">Todas las dificultades</option>${Object.entries(difficultyLabels).map(([k,v])=>`<option value="${k}" ${qFilterDiff===k?'selected':''}>${v}</option>`).join('')}</select></div>
<div class="list q-bank-list">${list.map(q=>{const i=s.questions.indexOf(q);return `<div class="q-row ${editing===i?'active':''} ${q.used?'used':''}"><span class="q-num">${i+1}</span><button class="title q-title-btn" onclick="editQ(${i})"><b>${esc(q.text)}</b><span>${difficultyLabels[q.difficulty]} · ${esc(q.category)}${q.recent?' · reciente':''}</span></button><button class="btn ghost" onclick="editQ(${i})">Editar</button></div>`}).join('')}</div></section><aside>${qForm(s)}</aside></div>`}
function qForm(s){if(editing<0||editing>=s.questions.length)return'<div class="panel"><h3>Editor</h3><p class="muted">Selecciona una pregunta del banco.</p><p class="small muted">El comodín Cambiar toma automáticamente otra pregunta no usada de la misma categoría y dificultad.</p></div>';const q=s.questions[editing];return `<div class="panel"><div class="panel-title"><h3>Pregunta ${editing+1}</h3><span class="badge ${q.difficulty}">${money(s.config.prizeMap[q.difficulty])}</span></div><div class="form-grid"><div class="field full"><label>Pregunta</label><textarea id="qe_text">${esc(q.text)}</textarea></div><div class="field"><label>Categoría</label><input id="qe_cat" value="${esc(q.category)}"></div><div class="field"><label>Dificultad</label><select id="qe_diff">${Object.entries(difficultyLabels).map(([k,v])=>`<option value="${k}" ${q.difficulty===k?'selected':''}>${v}</option>`).join('')}</select></div>${q.options.map((o,i)=>`<div class="field full"><label>Alternativa ${letters[i]}</label><input id="qe_o${i}" value="${esc(o)}"></div>`).join('')}<div class="field"><label>Correcta</label><select id="qe_correct">${letters.map((l,i)=>`<option value="${i}" ${q.correctIndex===i?'selected':''}>${l}</option>`).join('')}</select></div><div class="field full"><label>Pista</label><textarea id="qe_hint">${esc(q.hint||'')}</textarea></div></div><div class="controls" style="margin-top:12px"><button class="btn primary" onclick="saveQ()">Guardar</button><button class="btn danger" onclick="deleteQ()">Eliminar</button></div><hr class="soft"><button class="btn ghost block" onclick="act('showQuestion',{index:${editing}});setTab('game')">Preparar manualmente esta pregunta</button></div>`}
function editQ(i){editing=i;render()}
function newQ(){latest.questions.push({id:`q_${Date.now()}`,category:'General',difficulty:'easy',text:'Nueva pregunta',options:['Opción A','Opción B','Opción C','Opción D'],correctIndex:0,hint:'',prize:250000});editing=latest.questions.length-1;render()}
async function saveQ(){const q={...latest.questions[editing],text:document.getElementById('qe_text').value.trim(),category:document.getElementById('qe_cat').value.trim(),difficulty:document.getElementById('qe_diff').value,options:[0,1,2,3].map(i=>document.getElementById(`qe_o${i}`).value.trim()),correctIndex:Number(document.getElementById('qe_correct').value),hint:document.getElementById('qe_hint').value.trim()};const copy=latest.questions.map((x,i)=>i===editing?q:x);try{await API.post('/api/questions',{questions:copy},true);toast('Pregunta guardada')}catch(e){toast(e.message)}}
async function deleteQ(){if(latest.questions.length<=1)return toast('Debe quedar una pregunta');if(!confirm('¿Eliminar esta pregunta?'))return;const copy=latest.questions.filter((_,i)=>i!==editing);editing=Math.min(editing,copy.length-1);try{await API.post('/api/questions',{questions:copy},true)}catch(e){toast(e.message)}}

function timerSettings(s){const presets=[10,15,20,30,45,60],cur=s.config.timerSeconds;return `<div class="field full"><label>Tiempo de respuesta</label><div class="timer-presets settings-presets">${presets.map(n=>`<button type="button" class="btn ghost ${cur===n?'selected-preset':''}" onclick="setTimerPreset(${n},this)">${n}s</button>`).join('')}<button type="button" class="btn ghost ${cur===0?'selected-preset':''}" onclick="setTimerPreset(0,this)">Sin límite</button></div><input id="cfg_timer" type="number" min="0" max="300" value="${cur}" placeholder="Personalizado en segundos"></div>`}
function setTimerPreset(n,btn){document.getElementById('cfg_timer').value=n;document.querySelectorAll('.settings-presets .btn').forEach(b=>b.classList.remove('selected-preset'));btn?.classList.add('selected-preset')}
function inventoryTable(s){const cats=Object.keys(s.questionInventory||{}).sort((a,b)=>a.localeCompare(b,'es'));return `<div class="inventory-table"><div class="inventory-head"><b>Categoría</b>${Object.values(difficultyLabels).map(x=>`<b>${x}</b>`).join('')}</div>${cats.map(c=>`<div class="inventory-row"><span>${esc(c)}</span>${['easy','medium','hard','impossible'].map(d=>`<span>${s.questionInventory[c]?.[d]||0}</span>`).join('')}</div>`).join('')}</div>`}

function settingsTab(s){return `<div class="host-grid"><section class="panel"><div class="kicker">Configuración</div><h2>Formato de la partida</h2><div class="form-grid">
<div class="field full"><label>Título</label><input id="cfg_title" value="${esc(s.config.showTitle)}"></div><div class="field full"><label>Subtítulo</label><input id="cfg_sub" value="${esc(s.config.showSubtitle)}"></div>
<div class="field"><label>Concursante A</label><input id="cfg_a" value="${esc(s.config.playerAName)}"></div><div class="field"><label>Concursante B</label><input id="cfg_b" value="${esc(s.config.playerBName)}"></div>
<div class="field"><label>Modo</label><select id="cfg_mode"><option value="classic" ${s.config.mode==='classic'?'selected':''}>Clásico · concursante vs presentador</option><option value="duel" ${s.config.mode==='duel'?'selected':''}>Duelo · cara a cara</option></select></div>
<div class="field"><label>Concursante activo (clásico)</label><select id="cfg_active"><option value="A" ${s.config.activePlayer==='A'?'selected':''}>${esc(s.config.playerAName)}</option><option value="B" ${s.config.activePlayer==='B'?'selected':''}>${esc(s.config.playerBName)}</option></select></div>
<div class="field full"><label>Regla Duelo</label><select id="cfg_duel"><option value="fastest" ${s.config.duelRule==='fastest'?'selected':''}>Si ambos aciertan, gana el más rápido</option><option value="all" ${s.config.duelRule==='all'?'selected':''}>Todos los correctos puntúan</option></select></div>
${timerSettings(s)}
<div class="field"><label>Selección desde la pool</label><select id="cfg_select"><option value="random" ${s.config.selectionMode==='random'?'selected':''}>Aleatoria</option><option value="manual" ${s.config.selectionMode==='manual'?'selected':''}>Orden del banco</option></select></div>
<div class="field"><label>Elección de categoría en vivo (clásico)</label><select id="cfg_catChoice"><option value="off" ${s.config.categoryChoice==='off'?'selected':''}>Desactivada</option><option value="start" ${s.config.categoryChoice==='start'?'selected':''}>Una categoría al inicio para toda la partida</option><option value="perDifficulty" ${s.config.categoryChoice==='perDifficulty'?'selected':''}>Elegir al cambiar de dificultad</option></select></div>
<div class="field"><label>Evitar preguntas recientes</label><input id="cfg_recent" type="number" min="0" max="200" value="${s.config.avoidRecentCount}"><span class="small muted">Cantidad de preguntas recientes que la selección aleatoria intenta no repetir.</span></div></div>

<div class="rules-card"><div class="section-label">Reglas · Modo clásico</div><div class="form-grid"><div class="field"><label>Sistema de vidas</label><select id="cfg_lives"><option value="on" ${s.config.classicLivesEnabled?'selected':''}>Activado</option><option value="off" ${!s.config.classicLivesEnabled?'selected':''}>Desactivado</option></select></div><div class="field"><label>Vidas iniciales</label><input id="cfg_lifeCount" type="number" min="1" max="10" value="${s.config.classicStartingLives}"></div><div class="field full"><label>Al perder todas las vidas</label><select id="cfg_zeroLives"><option value="end" ${s.config.classicZeroLivesMode==='end'?'selected':''}>Terminar la partida</option><option value="continue" ${s.config.classicZeroLivesMode==='continue'?'selected':''}>Continuar fuera de competencia</option></select></div></div><p class="small muted">El dinero representa el escalón más alto alcanzado; ya no se suma pregunta por pregunta.</p></div>

<div class="rules-card"><div class="section-label">Reglas · Modo Duelo</div><div class="form-grid"><div class="field full"><label>Sistema de puntos</label><select id="cfg_points"><option value="on" ${s.config.duelPointsEnabled?'selected':''}>Activado</option><option value="off" ${!s.config.duelPointsEnabled?'selected':''}>Desactivado · usar dinero acumulado</option></select></div>${Object.entries(difficultyLabels).map(([k,v])=>`<div class="field"><label>${v} · puntos</label><input id="pt_${k}" type="number" min="0" max="100" value="${s.config.pointMap[k]}"></div>`).join('')}</div><p class="small muted">Con puntos activos, el dinero sigue dando valor dramático a la pregunta, pero el ganador del Duelo se decide por puntos.</p></div>

<div class="section-label">Cantidad de rondas por dificultad</div><div class="round-plan-grid">${Object.entries(difficultyLabels).map(([k,v])=>{const max=s.roundCapacity?.[k]??20;return `<div class="field"><label>${v}</label><input id="rp_${k}" type="number" min="0" max="${max}" value="${Math.min(s.config.roundPlan[k],max)}"><span class="small muted">Máx. disponible: ${max}</span></div>`}).join('')}</div>
<div class="rules-card security-card"><div class="section-label">Seguridad del anfitrión</div><div class="field"><label>Nuevo PIN</label><input id="cfg_pin" type="password" inputmode="numeric" minlength="4" maxlength="8" placeholder="Dejar vacío para conservar el actual"><span class="small muted">4–8 dígitos. PIN predeterminado: <b>0000</b>. ${s.security?.hostPinIsDefault?'Actualmente estás usando el predeterminado.':'Actualmente hay un PIN personalizado.'}</span></div></div>
<button class="btn primary" style="margin-top:14px" onclick="saveCfg()">Guardar configuración</button></section>
<aside><div class="panel"><div class="section-label" style="margin-top:0">${s.config.mode==='duel'&&s.config.duelPointsEnabled?'Premios + puntos':'Premios fijos'}</div>${ladder(s)}</div>
<div class="panel" style="margin-top:18px"><h3>Pool incluida</h3><p class="small muted">${s.questionCount} preguntas disponibles. La cantidad máxima de rondas se adapta automáticamente al banco actual.</p>${inventoryTable(s)}</div>
<div class="panel" style="margin-top:18px"><h3>Persistencia y pruebas</h3><p class="small muted">Historial registrado: ${s.recentHistoryCount||0}. Borrarlo permite que vuelvan a aparecer preguntas usadas recientemente.</p><button class="btn ghost block" onclick="clearHistory()">Borrar historial reciente</button></div>
<div class="panel" style="margin-top:18px"><h3>Pack del programa</h3><div class="controls"><button class="btn" onclick="exportPack()">Exportar JSON</button><label class="btn ghost">Importar JSON<input type="file" accept="application/json" style="display:none" onchange="importPack(this.files[0])"></label></div></div></aside></div>`}

async function saveCfg(){const newPin=document.getElementById('cfg_pin').value.trim();if(newPin&&!/^\d{4,8}$/.test(newPin))return toast('El PIN debe tener entre 4 y 8 dígitos');const body={showTitle:document.getElementById('cfg_title').value,showSubtitle:document.getElementById('cfg_sub').value,playerAName:document.getElementById('cfg_a').value,playerBName:document.getElementById('cfg_b').value,mode:document.getElementById('cfg_mode').value,activePlayer:document.getElementById('cfg_active').value,duelRule:document.getElementById('cfg_duel').value,timerSeconds:Number(document.getElementById('cfg_timer').value||0),selectionMode:document.getElementById('cfg_select').value,categoryChoice:document.getElementById('cfg_catChoice').value,avoidRecentCount:Number(document.getElementById('cfg_recent').value||0),classicLivesEnabled:document.getElementById('cfg_lives').value==='on',classicStartingLives:Number(document.getElementById('cfg_lifeCount').value||3),classicZeroLivesMode:document.getElementById('cfg_zeroLives').value,duelPointsEnabled:document.getElementById('cfg_points').value==='on',pointMap:{easy:Number(document.getElementById('pt_easy').value||0),medium:Number(document.getElementById('pt_medium').value||0),hard:Number(document.getElementById('pt_hard').value||0),impossible:Number(document.getElementById('pt_impossible').value||0)},roundPlan:{easy:Number(document.getElementById('rp_easy').value||0),medium:Number(document.getElementById('rp_medium').value||0),hard:Number(document.getElementById('rp_hard').value||0),impossible:Number(document.getElementById('rp_impossible').value||0)}};if(newPin)body.hostPin=newPin;try{const r=await API.post('/api/config',body,true);if(newPin&&r.pinChanged){sessionStorage.setItem('focoHostPin',newPin);connect()}toast('Configuración guardada')}catch(e){toast(e.message)}}
async function clearHistory(){if(confirm('¿Permitir que vuelvan a salir preguntas recientes?'))act('clearRecentHistory')}
function exportPack(){const u=new URL('/api/export',location.origin);u.searchParams.set('pin',hostPin());const c=accessCode();if(c)u.searchParams.set('code',c);location.href=u}
async function importPack(file){if(!file)return;try{await API.post('/api/import',JSON.parse(await file.text()),true);toast('Pack importado')}catch(e){toast(e.message)}}

function render(){if(!latest)return;document.getElementById('host').innerHTML=`<div class="tabs"><button class="tab ${tab==='game'?'active':''}" onclick="setTab('game')">Control en vivo</button><button class="tab ${tab==='questions'?'active':''}" onclick="setTab('questions')">Preguntas</button><button class="tab ${tab==='settings'?'active':''}" onclick="setTab('settings')">Configuración</button></div>`+(tab==='game'?gameTab(latest):tab==='questions'?questionsTab(latest):settingsTab(latest))}
(async()=>{if(hostPin()){try{latest=await API.state('host');connect();return}catch{sessionStorage.removeItem('focoHostPin')}}openPin()})();
</script></body></html>
