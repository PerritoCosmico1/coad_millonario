<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><link rel="manifest" href="/manifest.webmanifest?v=__APP_VERSION__"><link rel="icon" href="/assets/icon-192.png?v=__APP_VERSION__"><title>Concursante · __APP_SHORT_NAME__</title><link rel="stylesheet" href="/styles.css?v=__APP_VERSION__"></head>
<body><div id="app" class="player-page"></div><script src="/common.js?v=__APP_VERSION__"></script><script>
const player=new URLSearchParams(location.search).get('player')==='B'?'B':'A';let latest=null;
function pname(s){return player==='A'?s.config.playerAName:s.config.playerBName}
function pts(n){return `${Number(n||0)} ${Number(n||0)===1?'punto':'puntos'}`}
function playerMetric(s){return s.config.mode==='duel'&&s.config.duelPointsEnabled?`<div class="player-money player-points">${pts(s.points[player])}</div>`:`<div class="player-money">${money(s.winnings[player])}</div>`}
function playerPot(s){return s.config.mode==='duel'&&s.config.duelPointsEnabled?`<div class="player-pot"><span>POZO</span><b>${money(s.config.duelPrizePot)}</b></div>`:''}
function playerLives(s){if(s.config.mode!=='classic'||!s.config.classicLivesEnabled)return'';const total=s.config.classicStartingLives,remain=s.lives[player];return `<div class="player-life-strip">${Array.from({length:total},(_,i)=>`<span class="life-heart ${i<remain?'alive':'spent'}">♥</span>`).join('')}<b>${remain}/${total}</b></div>`}
async function choose(i){try{await API.post('/api/answer',{player,answer:i});toast(`Respuesta ${letters[i]} enviada`)}catch(e){toast(e.message)}}
async function chooseCategory(c){try{await API.post('/api/category',{player,category:c});toast(`Categoría: ${c}`)}catch(e){toast(e.message)}}
async function chooseWheel(i){try{await API.post('/api/wheelAnswer',{player,answer:i});toast(`Respuesta ${letters[i]} enviada`)}catch(e){toast(e.message)}}

function renderWheel(s){const w=s.wheel,app=document.getElementById('app'),name=pname(s),isMe=w.activePlayer===player;
if(!isMe){const otherName=w.activePlayer==='A'?s.config.playerAName:s.config.playerBName;app.innerHTML=`<div class="player-card"><div class="kicker">Ruleta especial</div><h1>${esc(name)}</h1><p class="muted">Este segmento lo juega ${esc(otherName)}. Espera la señal de producción.</p></div>`;return}
if(w.phase==='idle'||w.phase==='ready'){app.innerHTML=`<div class="player-card player-intro"><div class="kicker">Ruleta especial</div><h1>${esc(name)}</h1><p class="muted">Prepárate, vas a girar la ruleta de categorías.</p></div>`;return}
if(w.phase==='spinning'){app.innerHTML=`<div class="player-card"><div class="kicker">Girando…</div><h1>${esc(name)}</h1><p class="muted">Espera a que salga la categoría.</p></div>`;return}
if(w.phase==='category'){app.innerHTML=`<div class="player-card"><div class="kicker">Categoría</div><h1>${esc(w.selectedCategory)}</h1><p class="muted">Prepárate para la pregunta.</p></div>`;return}
const q=w.question;
if(!q){app.innerHTML=`<div class="player-card"><div class="kicker">Ruleta</div><h1>${esc(name)}</h1><p class="muted">Preparando la pregunta…</p></div>`;return}
const open=w.phase==='open';
const opts=q.options.map((o,i)=>{let c='player-choice';if(w.answer===i)c+=' selected';if(w.correctRevealed&&i===q.correctIndex)c+=' correct';if(w.correctRevealed&&w.answer===i&&i!==q.correctIndex)c+=' wrong';return `<button class="${c}" ${open?'':'disabled'} onclick="chooseWheel(${i})"><strong>${letters[i]}</strong><br>${esc(o)}</button>`}).join('');
let st='Espera la señal de producción';if(w.phase==='open')st=w.answer===null?'Elige una respuesta':'Respuesta registrada. Puedes cambiarla mientras siga abierto.';if(w.phase==='locked')st=w.timerExpired?'Tiempo agotado · respuesta bloqueada':'Respuesta bloqueada';if(w.phase==='result')st=w.result==='correct'?'¡Respuesta correcta!':'Respuesta incorrecta';
app.innerHTML=`<div class="player-card"><div class="kicker">Ruleta · ${esc(q.category)}</div><h1>${esc(name)}</h1><div class="player-timer ${open?'running':''}" data-timer-wrap><span>${s.config.wheel.timerSeconds?'TIEMPO':'SIN LÍMITE'}</span><b data-live-timer>${wheelTimerLabel(w,s.config.wheel.timerSeconds)}</b></div><div class="player-question">${esc(q.text)}</div><div class="player-answers">${opts}</div><div class="player-status">${esc(st)}</div></div>`;updateDynamic()}

function render(s){latest=s;const app=document.getElementById('app'),name=pname(s),active=s.config.mode==='duel'||s.config.activePlayer===player;
if(s.wheel&&s.wheel.onAir){renderWheel(s);return}
if(s.phase==='commercial'){app.innerHTML=`<div class="player-card"><div class="kicker">Pausa comercial</div><h1>${esc(name)}</h1><p class="muted">Espera la señal de producción.</p></div>`;return}
if(s.phase==='intro'){app.innerHTML=`<div class="player-card player-intro"><div class="kicker">Comienza el juego</div><h1>${esc(name)}</h1>${playerMetric(s)}${playerPot(s)}${playerLives(s)}<p class="muted">${s.config.mode==='duel'?'Prepárate para el duelo. El ganador por puntos se lleva el pozo.':active?'Tú juegas esta partida.':'Espera la señal de producción.'}</p></div>`;return}
if(s.phase==='category'||s.phase==='categoryChosen'){if(!active){app.innerHTML=`<div class="player-card"><div class="kicker">Elección de categoría</div><h1>${esc(name)}</h1><p class="muted">El otro concursante está eligiendo.</p></div>`;return}const chosen=s.selectedCategory;app.innerHTML=`<div class="player-card"><div class="kicker">${difficultyLabels[s.pendingDifficulty]} · Ronda ${s.roundIndex+1}</div><h1>${chosen?'Categoría elegida':'Elige una categoría'}</h1>${playerMetric(s)}${playerLives(s)}<div class="player-category-grid">${s.availableCategories.map(c=>`<button class="player-category ${chosen===c?'selected':''}" ${s.phase==='categoryChosen'?'disabled':''} onclick="chooseCategory('${esc(c)}')">${esc(c)}</button>`).join('')}</div>${chosen?`<div class="player-status">Esperando confirmación de producción · ${esc(chosen)}</div>`:''}</div>`;return}
if(s.phase==='summary'||s.phase==='final'){const st=s.summary.stats[player],wonPot=s.config.mode==='duel'&&s.config.duelPointsEnabled&&st.prizeWon>0;app.innerHTML=`<div class="player-card player-intro"><div class="kicker">${s.phase==='summary'?'Resumen final':'Partida terminada'}</div><h1>${esc(name)}</h1>${playerMetric(s)}${playerLives(s)}${wonPot?`<div class="player-pot won"><span>POZO GANADO</span><b>${money(st.prizeWon)}</b></div>`:s.config.mode==='duel'&&s.config.duelPointsEnabled?playerPot(s):''}<p class="muted">${st.correct} respuestas correctas · ${st.roundWins} rondas ganadas${s.config.mode==='classic'?` · ${money(st.winnings)}`:''}</p></div>`;return}
if(!s.question||s.phase==='idle'){app.innerHTML=`<div class="player-card"><div class="kicker">${esc(s.config.showTitle)}</div><h1>${esc(name)}</h1>${playerMetric(s)}${playerLives(s)}<p class="muted">Esperando la primera pregunta…</p></div>`;return}
if(!active){app.innerHTML=`<div class="player-card"><div class="kicker">${esc(s.config.showTitle)}</div><h1>${esc(name)}</h1>${playerMetric(s)}<p class="muted">Esta pregunta la juega el otro concursante.</p></div>`;return}

const q=s.question,my=s.answers[player],hidden=q.hiddenOptions||[],open=s.phase==='open';
const opts=q.options.map((o,i)=>{let c='player-choice';if(i>=s.revealedOptions)c+=' unrevealed';if(my===i)c+=' selected';if(hidden.includes(i))c+=' eliminated';if(s.correctRevealed&&i===q.correctIndex)c+=' correct';if(s.correctRevealed&&my===i&&i!==q.correctIndex)c+=' wrong';const disabled=!open||i>=s.revealedOptions||hidden.includes(i);return `<button class="${c}" ${disabled?'disabled':''} onclick="choose(${i})"><strong>${letters[i]}</strong><br>${esc(o)}</button>`}).join('');
let st='Espera la señal de producción';if(s.phase==='open')st=my===null?'Elige una respuesta':'Respuesta registrada. Puedes cambiarla mientras siga abierto.';if(s.phase==='locked')st=s.timerExpired?'Tiempo agotado · respuesta bloqueada':'Respuesta bloqueada';if(s.phase==='result')st=my===q.correctIndex?'Respuesta correcta':'Resultado revelado';if(s.eliminated[player])st='Fuera de competencia · puedes seguir respondiendo, pero ya no optas al premio.';
const lf=s.lifelines[player],life=k=>`<span class="player-life ${lf[k]?'on':''}">${k==='fifty'?'50/50':k==='hint'?'Pista':'Cambio'} ${lf[k]?'':'· usado'}</span>`;
const pointValue=s.config.mode==='duel'&&s.config.duelPointsEnabled?` · ${s.config.pointMap[q.difficulty]} pts`:'';
app.innerHTML=`<div class="player-card ${s.eliminated[player]?'player-eliminated':''}"><div class="kicker">${esc(s.config.showTitle)} · ${difficultyLabels[q.difficulty]} · ${esc(q.category)}${pointValue}</div><h1>${esc(name)}</h1>${playerMetric(s)}${playerLives(s)}<div class="player-timer ${s.phase==='open'?'running':''}" data-timer-wrap><span>${s.config.timerSeconds?'TIEMPO':'SIN LÍMITE'}</span><b data-live-timer>${timerLabel(s)}</b></div>${s.config.mode==='classic'?`<div class="player-lifelines">${life('fifty')}${life('hint')}${life('swap')}</div>`:''}<div class="player-question">${esc(q.text)}</div>${q.hint?`<div class="player-hint"><b>Pista:</b> ${esc(q.hint)}</div>`:''}<div class="player-answers">${opts}</div><div class="player-status">${esc(st)}</div></div>`;updateDynamic()}
function updateDynamic(){if(!latest)return;const onWheel=latest.wheel&&latest.wheel.onAir;const seconds=onWheel?latest.config.wheel.timerSeconds:latest.config.timerSeconds;const phase=onWheel?latest.wheel.phase:latest.phase;const ms=onWheel?wheelTimerRemaining(latest.wheel,seconds):timerRemaining(latest),urgent=ms!=null&&ms<=10000&&phase==='open',critical=ms!=null&&ms<=5000&&phase==='open';document.querySelectorAll('[data-live-timer]').forEach(el=>el.textContent=onWheel?wheelTimerLabel(latest.wheel,seconds):timerLabel(latest));document.querySelectorAll('[data-timer-wrap]').forEach(el=>{el.classList.toggle('danger-time',urgent);el.classList.toggle('critical-time',critical)})}
setInterval(updateDynamic,100);
const stream=API.stream('player',player,render,()=>{});window.addEventListener('beforeunload',()=>stream.close());
</script></body></html>
