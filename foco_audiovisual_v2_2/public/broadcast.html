<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02040e"><link rel="manifest" href="/manifest.webmanifest"><title>FOCO · Emisión</title><link rel="stylesheet" href="/styles.css"></head>
<body class="broadcast-body"><button class="fullscreen-btn" onclick="goFullscreen()">Pantalla completa</button><div id="app"></div><script src="/common.js"></script><script>
let prev=null,latest=null;
function goFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()}
function pname(s,p){return p==='A'?s.config.playerAName:s.config.playerBName}
function shortMark(s,p){const a=pname(s,p).trim().replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9 ]/g,'').split(/\s+/).filter(Boolean);const first=(a[0]?.[0]||p).toUpperCase();const other=p==='A'?'B':'A',b=pname(s,other).trim().replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9 ]/g,'').split(/\s+/).filter(Boolean),otherFirst=(b[0]?.[0]||other).toUpperCase();if(first!==otherFirst)return first;const token=(a[0]||p).toUpperCase();return token.slice(0,2)}
function isWinner(s,p){return !!s.duelResult?.winners?.includes(p)}
function status(s){const x={question:s.revealedOptions<4?'Presentando alternativas':'Pregunta lista',open:'Respuestas abiertas',locked:s.timerExpired?'Tiempo agotado':'Respuestas bloqueadas',result:'Resultado'};return x[s.phase]||s.message||''}

function playerBox(s,p,right=false){const name=pname(s,p),a=s.answers[p],show=s.revealedPlayerAnswers[p]&&a!==null,bump=prev&&prev.winnings?.[p]!==s.winnings[p],winner=s.config.mode==='duel'&&s.correctRevealed&&isWinner(s,p),time=s.responseTimes?.[p];return `<div class="broadcast-player player-${p.toLowerCase()} ${right?'right':''} ${bump?'bump':''} ${winner?'round-winner':''}"><div><div class="name">${esc(name)}</div><div class="cash">${money(s.winnings[p])}</div>${show?`<div class="answer-reveal-pill">Respuesta ${letters[a]}${time!=null?` · ${formatMs(time)}`:''}</div>`:''}${winner?`<div class="winner-tag">GANADOR DE RONDA</div>`:''}</div></div>`}
function ladder(s){return `<aside class="ladder-side">${[['impossible','Imposible'],['hard','Difícil'],['medium','Medio'],['easy','Fácil']].map(([k,l])=>`<div class="ladder-step ${s.question?.difficulty===k||s.pendingDifficulty===k?'current':''}"><div class="label">${l}</div><div class="value">${money(s.config.prizeMap[k])}</div></div>`).join('')}</aside>`}

function intro(s){const active=s.config.activePlayer;const players=s.config.mode==='duel'
?`<div class="intro-player player-a"><span>${shortMark(s,'A')}</span><b>${esc(pname(s,'A'))}</b></div><div class="intro-vs">VS</div><div class="intro-player player-b"><span>${shortMark(s,'B')}</span><b>${esc(pname(s,'B'))}</b></div>`
:`<div class="intro-player player-${active.toLowerCase()} solo"><span>${shortMark(s,active)}</span><b>${esc(pname(s,active))}</b></div>`;
return `<main class="broadcast intro-screen"><header class="broadcast-header"><div class="broadcast-logo">${esc(s.config.showTitle)}</div><div class="mode-chip">${s.config.mode==='duel'?'Duelo':'Modo clásico'}</div></header><div class="intro-content"><div class="intro-orbit"></div><div class="kicker">Comienza el juego</div><h1>${esc(s.config.showTitle)}</h1><p>${esc(s.config.showSubtitle)}</p><div class="intro-players">${players}</div><div class="intro-prizes"><span>FÁCIL <b>${money(s.config.prizeMap.easy)}</b></span><span>MEDIO <b>${money(s.config.prizeMap.medium)}</b></span><span>DIFÍCIL <b>${money(s.config.prizeMap.hard)}</b></span><span>IMPOSIBLE <b>${money(s.config.prizeMap.impossible)}</b></span></div></div></main>`}

function categoryScreen(s){const active=s.config.activePlayer,chosen=s.selectedCategory;return `<main class="broadcast category-screen"><header class="broadcast-header"><div><div class="broadcast-logo">${esc(s.config.showTitle)}</div><div class="broadcast-sub">${s.roundIndex+1}/${s.roundSequence.length} · ${difficultyLabels[s.pendingDifficulty]}</div></div><div class="mode-chip">ELECCIÓN DE CATEGORÍA</div></header><div class="category-stage"><div class="kicker">${esc(pname(s,active))}</div><h1>${chosen?'HA ELEGIDO':'ELIGE TU CATEGORÍA'}</h1><div class="category-stage-grid">${s.availableCategories.map(c=>`<div class="category-stage-card ${chosen===c?'chosen':''}">${esc(c)}</div>`).join('')}</div>${chosen?`<div class="category-confirmed">${esc(chosen)}</div>`:''}</div></main>`}

function duelResultPanel(s){if(s.config.mode!=='duel'||!s.correctRevealed||!s.duelResult)return'';const r=s.duelResult;let headline='SIN GANADOR',sub='Ninguno acertó la respuesta.';if(r.winners.length){headline=r.winners.length===2?`EMPATE · ${esc(pname(s,r.winners[0]))} + ${esc(pname(s,r.winners[1]))}`:`GANA ${esc(pname(s,r.winners[0]))}`;if(r.reason==='fastest'&&r.deltaMs!=null)sub=`Diferencia de respuesta: ${formatMs(r.deltaMs)}.`;else if(r.reason==='correct')sub='Fue el único en acertar.';else if(r.reason==='all')sub='Ambos acertaron.';else if(r.reason==='tie')sub='Mismo tiempo registrado.'}const times=r.bothCorrect?`<div class="duel-times"><span class="time-a">${esc(pname(s,'A'))}: <b>${formatMs(r.responseMs.A)}</b></span><span class="delta-time">Δ ${formatMs(r.deltaMs)}</span><span class="time-b">${esc(pname(s,'B'))}: <b>${formatMs(r.responseMs.B)}</b></span></div>`:'';return `<div class="duel-result-broadcast ${r.winners.length?'has-winner':'no-winner'}"><div class="duel-result-title">${headline}</div><div class="duel-result-sub">${sub}</div>${times}</div>`}

function summaryScreen(s){const sum=s.summary,stats=sum.stats;const playerStat=p=>`<div class="summary-player player-${p.toLowerCase()}"><div class="summary-name">${esc(pname(s,p))}</div><div class="summary-money">${money(stats[p].winnings)}</div><div class="summary-grid"><span>Aciertos <b>${stats[p].correct}</b></span><span>Rondas ganadas <b>${stats[p].roundWins}</b></span><span>Tiempo prom. <b>${formatMs(stats[p].avgResponseMs)}</b></span></div></div>`;return `<main class="broadcast end-screen summary-screen"><header class="broadcast-header"><div class="broadcast-logo">${esc(s.config.showTitle)}</div><div class="mode-chip">RESUMEN FINAL</div></header><div class="end-content"><div class="kicker">Partida completada</div><h1>ASÍ TERMINÓ EL JUEGO</h1><p>${sum.roundsPlayed} rondas jugadas</p><div class="summary-players">${s.config.mode==='duel'?playerStat('A')+playerStat('B'):playerStat(s.config.activePlayer)}</div><div class="summary-difficulty-row">${['easy','medium','hard','impossible'].map(d=>`<span>${difficultyLabels[d]} <b>${s.roundHistory.filter(r=>r.difficulty===d).length}</b></span>`).join('')}</div></div></main>`}

function finalScreen(s){const out=s.summary.outcome;if(s.config.mode==='duel'){if(out.type==='tie')return `<main class="broadcast end-screen final-screen tie"><div class="end-content"><div class="kicker">Resultado definitivo</div><h1>EMPATE</h1><p>${esc(pname(s,'A'))} · ${money(s.winnings.A)} &nbsp;&nbsp; / &nbsp;&nbsp; ${esc(pname(s,'B'))} · ${money(s.winnings.B)}</p></div></main>`;const p=out.winners[0];return `<main class="broadcast end-screen final-screen victory"><div class="end-content"><div class="kicker">Resultado definitivo</div><h1>CAMPEÓN</h1><h2>${esc(pname(s,p))}</h2><div class="final-money">${money(s.winnings[p])}</div></div></main>`}
const p=s.config.activePlayer,won=out.type==='victory';return `<main class="broadcast end-screen final-screen ${won?'victory':'defeat'}"><div class="end-content"><div class="kicker">Resultado definitivo</div><h1>${won?'VICTORIA':'FIN DEL JUEGO'}</h1><h2>${esc(pname(s,p))}</h2><div class="final-money">${money(s.winnings[p])}</div><p>${won?'Superaste la pregunta imposible.':'Partida finalizada.'}</p></div></main>`}

function render(s){latest=s;const app=document.getElementById('app');
if(s.phase==='commercial'){app.innerHTML=`<main class="broadcast commercial-screen"><div class="commercial-center"><div class="commercial-ring"><div><div class="kicker">Pausa comercial</div><h1>${esc(s.config.showTitle)}</h1><p class="muted">Volvemos en breve</p></div></div></div></main>`;prev=s;return}
if(s.phase==='intro'){app.innerHTML=intro(s);prev=s;return}
if(s.phase==='category'||s.phase==='categoryChosen'){app.innerHTML=categoryScreen(s);prev=s;return}
if(s.phase==='summary'){app.innerHTML=summaryScreen(s);prev=s;return}
if(s.phase==='final'){app.innerHTML=finalScreen(s);prev=s;return}
if(s.phase==='idle'||!s.question){app.innerHTML=`<main class="broadcast"><div class="center-screen"><div><div class="kicker">Próximamente</div><h1>${esc(s.config.showTitle)}</h1><p class="muted">${esc(s.config.showSubtitle)}</p></div></div></main>`;prev=s;return}

const q=s.question,changed=!prev||prev.question?.id!==q.id||prev.question?.variant!==q.variant,revealChanged=prev&&prev.revealedOptions!==s.revealedOptions,hidden=q.hiddenOptions||[];
const ma=shortMark(s,'A'),mb=shortMark(s,'B');
const options=q.options.map((o,i)=>{const visible=i<s.revealedOptions,just=revealChanged&&i===s.revealedOptions-1,pickA=s.revealedPlayerAnswers.A&&s.answers.A===i,pickB=s.revealedPlayerAnswers.B&&s.answers.B===i;let c=`broadcast-answer ${visible?'visible':''} ${just?'just-revealed':''}`;if(hidden.includes(i))c+=' eliminated';if(s.config.mode==='duel'){if(pickA&&pickB)c+=' picked-both';else if(pickA)c+=' picked-a';else if(pickB)c+=' picked-b'}else if((s.config.activePlayer==='A'&&pickA)||(s.config.activePlayer==='B'&&pickB))c+=' player-picked';if(s.correctRevealed&&i===q.correctIndex)c+=' correct';if(s.correctRevealed&&(pickA||pickB)&&i!==q.correctIndex)c+=' wrong-picked';if(s.correctRevealed&&s.config.mode==='duel'&&((pickA&&isWinner(s,'A'))||(pickB&&isWinner(s,'B'))))c+=' winning-choice';const badges=s.config.mode==='duel'&&(pickA||pickB)?`<span class="duel-choice-badges">${pickA?`<i class="pick-a">${esc(ma)}</i>`:''}${pickB?`<i class="pick-b">${esc(mb)}</i>`:''}</span>`:'';return `<div class="${c}"><span class="letter">${letters[i]}</span><span class="answer-copy">${esc(o)}</span>${badges}</div>`}).join('');

const footer=s.config.mode==='duel'?`${playerBox(s,'A')}<div class="broadcast-status">${esc(status(s))}</div>${playerBox(s,'B',true)}`:`${playerBox(s,s.config.activePlayer)}<div class="broadcast-status">${esc(status(s))}</div><div></div>`;
app.innerHTML=`<main class="broadcast"><header class="broadcast-header"><div><div class="broadcast-logo">${esc(s.config.showTitle)}</div><div class="broadcast-sub">Ronda ${s.roundIndex+1}/${s.roundSequence.length} · ${esc(s.config.showSubtitle)}</div></div><div class="mode-chip">${s.config.mode==='duel'?'Duelo':'Modo clásico'}</div></header>
<section class="broadcast-main"><div><div class="broadcast-meta"><span class="badge ${q.difficulty}">${difficultyLabels[q.difficulty]}</span><span class="badge">${esc(q.category)}</span><span class="badge">${money(q.prize)}</span></div>
<div class="broadcast-timer broadcast-timer-center ${s.phase==='open'?'running':''}" data-timer-wrap><span>${s.config.timerSeconds?'TIEMPO RESTANTE':'SIN LÍMITE'}</span><b data-live-timer>${timerLabel(s)}</b><div class="timer-bar"><i data-timer-bar></i></div></div>
<div class="broadcast-question ${changed?'animate-in':''}">${esc(q.text)}</div><div class="broadcast-answers">${options}</div>${q.hint?`<div class="hint-card"><b>Pista:</b> ${esc(q.hint)}</div>`:''}${duelResultPanel(s)}</div>${ladder(s)}</section>
<footer class="broadcast-footer">${footer}</footer></main>`;prev=s;updateDynamic()}

function updateDynamic(){if(!latest)return;const ms=timerRemaining(latest),urgent=ms!=null&&ms<=10000&&latest.phase==='open',critical=ms!=null&&ms<=5000&&latest.phase==='open';document.querySelectorAll('[data-live-timer]').forEach(el=>el.textContent=timerLabel(latest));document.querySelectorAll('[data-timer-wrap]').forEach(el=>{el.classList.toggle('danger-time',urgent);el.classList.toggle('critical-time',critical)});document.querySelectorAll('[data-timer-bar]').forEach(el=>{if(!latest.config.timerSeconds){el.style.width='100%';return}const total=latest.config.timerSeconds*1000;el.style.width=`${Math.max(0,Math.min(100,(ms??total)/total*100))}%`})}
setInterval(updateDynamic,100);
const stream=API.stream('display','',render,()=>{});window.addEventListener('beforeunload',()=>stream.close());
</script></body></html>
